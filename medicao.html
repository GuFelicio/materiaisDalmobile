<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2f2f0">
<title>Termo de medição · Dalmóbile</title>

<!-- ============================================================
     DOCUMENTO 101 — tela do medidor
     ------------------------------------------------------------
     Esta tela é usada EM CAMPO: apartamento em obra, poeira,
     celular na mão, cliente esperando. Três consequências que
     mandam em todo o resto deste arquivo:

     1. NADA AQUI DEPENDE DE INTERNET.
        O rascunho mora no próprio aparelho (IndexedDB) e o PDF
        é montado dentro do navegador. O servidor é destino de
        sincronia, nunca pré-requisito. Se a rede voltar, sobe;
        se não voltar, o medidor ainda sai da obra com o PDF.

     2. O DEDO É GROSSO E O TEMPO É CURTO.
        Apto / Não apto / Não se aplica são botões grandes. Os
        campos de texto só aparecem quando há o que escrever —
        nove itens com dois campos cada, todos abertos, é um
        formulário que ninguém preenche até o fim.

     3. O QUE NÃO FOI RESPONDIDO APARECE.
        Item em branco sai no PDF como "NÃO RESPONDIDO", em
        âmbar. Documento de medição que esconde lacuna é pior
        que documento nenhum.
     ============================================================ -->

<style>
  :root {
    --bg: #f2f2f0; --card: #fff; --ink: #141618; --ink-2: #4a5054;
    --muted: #8a9094; --line: #e0e1df; --line-2: #c9cbc8; --accent: #141618;
    --ok: #1c6b3f; --ok-bg: #eef3ee; --ok-line: #cfe0d2;
    --aviso: #8a4b12; --aviso-bg: #fdf1e7; --aviso-line: #f0cfae;
    --erro: #b3261e; --erro-bg: #fdeceb; --erro-line: #f3c9c6;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-size: 16px; line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 620px; margin: 0 auto; padding: 0 16px 120px; }

  /* ---------- topo ---------- */

  .topo { position: relative; padding: 24px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .marca { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .marca span { font-weight: 400; color: var(--muted); }
  .assinatura { margin: 3px 0 0; font-size: 10px; font-weight: 600; letter-spacing: .18em;
                text-transform: uppercase; color: var(--muted); }

  .voltar { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0;
            padding: 13px 0; margin: 0 0 6px; font-family: inherit; font-size: 14.5px;
            font-weight: 600; color: var(--ink-2); cursor: pointer; text-decoration: none; }

  /* ---------- faixa de conexão ---------- */

  .rede { display: none; align-items: center; gap: 8px; padding: 10px 14px; margin-bottom: 16px;
          border-radius: 10px; font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  .rede.off { display: flex; background: var(--aviso-bg); border: 1px solid var(--aviso-line); color: var(--aviso); }
  .rede.pendente { display: flex; background: var(--ok-bg); border: 1px solid var(--ok-line); color: var(--ok); }
  .rede b { display: block; font-weight: 400; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }

  /* ---------- blocos ---------- */

  .painel { background: var(--card); border: 1px solid var(--line);
            border-radius: var(--radius); padding: 18px; margin-bottom: 18px; }
  .painel > h2 { margin: 0 0 3px; font-size: 17px; font-weight: 700; letter-spacing: -0.015em; }
  .painel > h2 + p { margin: 0 0 16px; font-size: 13.5px; color: var(--ink-2); }

  .secao { margin: 30px 0 14px; font-size: 11px; font-weight: 700; letter-spacing: .14em;
           text-transform: uppercase; color: var(--muted); }

  /* ---------- campos ---------- */

  label.rot { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em;
              text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }

  input[type=text], textarea, select {
    width: 100%; font-family: inherit; font-size: 16px; color: var(--ink);
    background: #fff; border: 1px solid var(--line-2); border-radius: 10px;
    padding: 12px 13px; line-height: 1.45;
  }
  textarea { resize: vertical; min-height: 76px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--ink); outline-offset: -2px; }

  .dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .campo { margin-bottom: 14px; }
  @media (max-width: 430px) { .dupla { grid-template-columns: 1fr; } }

  /* ---------- botões ---------- */

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px;
         font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
         border-radius: 10px; padding: 13px 18px; border: 1px solid var(--ink);
         background: var(--ink); color: #fff; min-height: 46px; }
  .btn.vazio { background: #fff; color: var(--ink); }
  .btn.largo { width: 100%; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.some { border: 0; background: none; color: var(--ink-2); padding: 10px 2px; min-height: 0; font-size: 14px; }

  /* ---------- lista de medições ---------- */

  /* O cartão é um contêiner, não um botão: dentro dele vive o
     botão de abrir e, para o administrador, o de apagar. Botão
     dentro de botão é HTML inválido e o clique fica imprevisível. */
  .ficha { background: var(--card); border: 1px solid var(--line);
           border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .ficha.removido { opacity: .62; border-style: dashed; }

  .ficha > .abrir { display: block; width: 100%; text-align: left; background: none;
                    border: 0; padding: 15px 16px; cursor: pointer; font-family: inherit;
                    color: inherit; }

  .ficha .acoes { display: flex; gap: 8px; padding: 0 16px 13px; }
  .ficha .acoes button { font-family: inherit; font-size: 13px; font-weight: 600;
                         cursor: pointer; border-radius: 9px; padding: 10px 13px;
                         min-height: 44px; background: #fff;
                         border: 1px solid var(--erro-line); color: var(--erro); }
  .ficha .acoes button:disabled { opacity: .5; cursor: default; }
  .ficha h3 { margin: 0 0 3px; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .ficha p { margin: 0; font-size: 13px; color: var(--ink-2); }
  .ficha .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }

  .tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .08em;
         text-transform: uppercase; padding: 4px 8px; border-radius: 6px;
         background: #f2f2f0; color: var(--ink-2); border: 1px solid var(--line); }
  .tag.ok     { background: var(--ok-bg);    color: var(--ok);    border-color: var(--ok-line); }
  .tag.aviso  { background: var(--aviso-bg); color: var(--aviso); border-color: var(--aviso-line); }
  .tag.erro   { background: var(--erro-bg);  color: var(--erro);  border-color: var(--erro-line); }

  /* ---------- documentos da equipe ---------- */

  .equipe-titulo { display: flex; align-items: baseline; justify-content: space-between;
                   gap: 12px; margin: 32px 0 6px; }
  .equipe-titulo h2 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .14em;
                      text-transform: uppercase; color: var(--muted); }
  .equipe-sub { margin: 0 0 12px; font-size: 12.5px; color: var(--ink-2); line-height: 1.4; }

  .autor { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
           padding: 4px 8px; border-radius: 6px; background: #ebebe8;
           border: 1px solid var(--line-2); color: var(--ink-2); }
  .autor.meu { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); }

  .vazio-msg { text-align: center; padding: 30px 16px; color: var(--ink-2); font-size: 14.5px; }

  /* ---------- itens do checklist ---------- */

  .item { background: var(--card); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .item.apto      { border-color: var(--ok-line); }
  .item.nao-apto  { border-color: var(--erro-line); }

  .item > header { display: flex; gap: 10px; align-items: baseline; margin-bottom: 4px; }
  .item .letra { font-size: 15px; font-weight: 700; color: var(--muted); min-width: 16px; }
  .item h3 { margin: 0; font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em; flex: 1; }

  .porque { background: none; border: 0; padding: 4px 0 0; margin: 0 0 10px 26px;
            font-family: inherit; font-size: 12.5px; font-weight: 600;
            color: var(--ink-2); cursor: pointer; text-decoration: underline; }
  .porque + .explica { display: none; }
  .porque.aberto + .explica { display: block; }
  .explica { margin: 0 0 12px 26px; font-size: 13px; line-height: 1.5; color: var(--ink-2);
             padding-left: 11px; border-left: 2px solid var(--line); }

  /* Três botões grandes. Em telas estreitas viram uma coluna,
     porque "NÃO APTO PARA MEDIÇÃO" espremido em 1/3 de 360px
     quebra em três linhas e vira alvo pequeno. */
  .escolha { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  @media (max-width: 460px) { .escolha { grid-template-columns: 1fr; } }

  .escolha button {
    font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer;
    border-radius: 10px; padding: 14px 8px; min-height: 52px; line-height: 1.25;
    border: 1.5px solid var(--line-2); background: #fff; color: var(--ink-2);
  }
  .escolha button[aria-pressed=true].sim  { background: var(--ok-bg);    border-color: var(--ok);    color: var(--ok); }
  .escolha button[aria-pressed=true].nao  { background: var(--erro-bg);  border-color: var(--erro);  color: var(--erro); }
  .escolha button[aria-pressed=true].na   { background: #ebebe8;         border-color: var(--line-2); color: var(--ink-2); }

  .detalhe { margin-top: 14px; }
  .detalhe[hidden] { display: none; }

  .exige { margin: 0 0 12px; font-size: 12.5px; font-weight: 600; color: var(--erro);
           background: var(--erro-bg); border: 1px solid var(--erro-line);
           border-radius: 8px; padding: 9px 11px; line-height: 1.4; }

  /* ---------- fotos ----------
     O anexo fica SEMPRE visível, em todos os nove itens.
     Na primeira versão ele só aparecia depois de marcar "não
     apto" — e aí ninguém achava. Função que existe e não se
     vê é função que não existe. O que continua escondido são
     os campos de texto, que é o que realmente pesaria na
     rolagem se os nove abrissem de uma vez. */

  .anexos { margin-top: 12px; }

  .anexar { display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
            border: 1.5px solid var(--line-2); border-radius: 10px;
            padding: 11px 15px; min-height: 46px; background: #fff;
            font-size: 14px; font-weight: 600; color: var(--ink-2); }
  .anexar span { font-size: 17px; line-height: 1; }

  /* Item reprovado e ainda sem foto: o botão cobra. É o registro
     fotográfico que sustenta o termo que o cliente vai assinar. */
  .item.nao-apto .anexar.vazio { border-color: var(--erro); color: var(--erro); background: var(--erro-bg); }

  .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .fotos:not(:empty) { margin-top: 10px; }
  .foto { position: relative; border-radius: 9px; overflow: hidden; border: 1px solid var(--line); background: #ebebe8; }
  .foto img { display: block; width: 100%; height: 104px; object-fit: cover; }
  .foto input { width: 100%; border: 0; border-top: 1px solid var(--line); border-radius: 0;
                font-size: 12.5px; padding: 10px 8px; background: #fff; }
  .foto .tirar { position: absolute; top: 5px; right: 5px; width: 34px; height: 34px;
                 border-radius: 50%; border: 0; background: rgba(20,22,24,.78); color: #fff;
                 font-size: 17px; line-height: 1; cursor: pointer; }


  /* ---------- ambientes ---------- */

  .amb { border: 1px solid var(--line); border-radius: 11px; padding: 13px; margin-bottom: 10px; background: #fff; }
  .amb-topo { display: flex; gap: 9px; align-items: center; margin-bottom: 11px; }
  .amb-topo input { flex: 1; }
  /* 44px é o piso: abaixo disso o dedo erra. Vale dobrado aqui,
     que é uma tela usada em pé, dentro de obra, muitas vezes com
     a mão suja. */
  .amb-topo button { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 9px;
                     border: 1px solid var(--line-2); background: #fff; color: var(--ink-2);
                     font-size: 19px; cursor: pointer; }
  .amb .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 430px) { .amb .mini { grid-template-columns: 1fr; } }
  .amb .mini label.rot { margin-bottom: 4px; }
  .amb select { padding: 12px 11px; font-size: 15px; min-height: 46px; }

  /* ---------- barra fixa ---------- */

  .barra { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(242,242,240,.96);
           backdrop-filter: blur(8px); border-top: 1px solid var(--line);
           padding: 11px 16px calc(11px + env(safe-area-inset-bottom)); z-index: 40; }
  .barra .dentro { max-width: 620px; margin: 0 auto; display: flex; gap: 9px; align-items: center; }
  .barra .estado { flex: 1; font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }
  .barra .btn { flex: 0 0 auto; }

  .oculto { display: none !important; }

  .nota { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; margin: 10px 0 0; }
</style>

<style id="trava-entrada">html { visibility: hidden; }</style>
</head>

<body>
<div class="wrap">

  <header class="topo">
    <h1 class="marca">Dalmóbile <span>· Central de Peças</span></h1>
    <p class="assinatura">Termo de medição · Doc 101</p>
  </header>

  <div class="rede" id="rede"></div>

  <!-- ---------- lista ---------- -->
  <section id="tela-lista">
    <a class="voltar" href="index.html">← Voltar para a Central</a>

    <div class="painel">
      <h2>Medições</h2>
      <p>Tudo que você preencher fica salvo neste aparelho, com ou sem internet.</p>
      <button class="btn largo" id="nova">+ Nova medição</button>
    </div>

    <div id="lista"></div>

    <div class="equipe-titulo oculto" id="equipe-titulo">
      <h2 id="equipe-rotulo"></h2>
    </div>
    <p class="equipe-sub oculto" id="equipe-sub"></p>
    <div id="equipe"></div>
  </section>

  <!-- ---------- ficha ---------- -->
  <section id="tela-ficha" class="oculto">
    <button class="voltar" id="voltar-lista">← Medições</button>

    <div class="painel">
      <h2>Dados da visita</h2>

      <div class="campo">
        <label class="rot" for="f-cliente">Cliente</label>
        <input type="text" id="f-cliente" autocomplete="off" placeholder="Nome do cliente">
      </div>

      <div class="dupla">
        <div class="campo">
          <label class="rot" for="f-contrato">Nº do contrato</label>
          <input type="text" id="f-contrato" autocomplete="off" placeholder="OR-D...">
        </div>
        <div class="campo">
          <label class="rot" for="f-loja">Loja</label>
          <select id="f-loja">
            <option value="sjc">São José dos Campos</option>
            <option value="cgt">Caraguatatuba</option>
          </select>
        </div>
      </div>

      <div class="campo">
        <label class="rot" for="f-tecnico">Técnico responsável</label>
        <input type="text" id="f-tecnico" autocomplete="off" placeholder="Seu nome">
      </div>

      <div class="campo" style="margin-bottom:0">
        <label class="rot" for="f-tipo">Contrato</label>
        <select id="f-tipo">
          <option value="total">Total</option>
          <option value="parcial">Parcial — só alguns ambientes</option>
        </select>
      </div>
    </div>

    <h2 class="secao">Ambientes a serem liberados</h2>
    <div id="ambientes"></div>
    <button class="btn vazio largo" id="add-ambiente">+ Ambiente</button>

    <div class="campo" style="margin-top:18px">
      <label class="rot" for="f-obs">Observações</label>
      <textarea id="f-obs" placeholder="Opcional"></textarea>
    </div>

    <h2 class="secao">Checklist para liberação</h2>
    <div id="checklist"></div>

    <div class="campo">
      <label class="rot" for="f-outros">Outros</label>
      <textarea id="f-outros" placeholder="Qualquer coisa fora dos nove itens"></textarea>
    </div>

    <h2 class="secao">Parecer final</h2>
    <div class="painel">
      <div class="escolha" id="parecer-final" style="grid-template-columns:1fr 1fr">
        <button type="button" class="sim" data-v="aptos"     aria-pressed="false">Ambientes aptos</button>
        <button type="button" class="nao" data-v="nao-aptos" aria-pressed="false">Ambientes não aptos</button>
      </div>

      <div class="campo" id="campo-nao-aptos" hidden style="margin:14px 0 0">
        <label class="rot" for="f-nao-aptos">Ambientes não aptos (medição parcial)</label>
        <textarea id="f-nao-aptos" placeholder="Relacione os ambientes"></textarea>
      </div>

      <div id="campo-caminho" hidden style="margin-top:16px">
        <label class="rot">O que o cliente decidiu?</label>
        <div class="escolha" id="caminho-inapto" style="grid-template-columns:1fr">
          <button type="button" class="na"  data-v="corrigir">
            Vai corrigir e remarcar a visita
          </button>
          <button type="button" class="nao" data-v="prosseguir">
            Quer prosseguir assumindo os riscos
          </button>
        </div>
      </div>

      <p class="nota" id="nota-termo"></p>
    </div>

    <div id="caixa-reabrir" class="painel oculto" style="margin-top:18px">
      <h2>Nova medição</h2>
      <p id="reabrir-porque"></p>
      <button class="btn largo" id="reabrir">Reabrir medição para nova visita</button>
    </div>

    <p class="nota oculto" id="veio-de" style="margin-bottom:14px"></p>

    <button class="btn vazio largo" id="apagar" style="margin-top:6px;border-color:var(--erro-line);color:var(--erro)">
      Apagar esta medição
    </button>
  </section>

</div>

<div class="barra oculto" id="barra">
  <div class="dentro">
    <div class="estado" id="estado"></div>
    <button class="btn vazio" id="enviar" hidden>Enviar</button>
    <button class="btn" id="salvar">Salvar PDF</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/fontkit.umd.min.js"></script>
<script src="campo.js"></script>
<script src="auth.js"></script>
<script src="pdf-101.js"></script>
<script>
(function () {
  'use strict';

  const C = window.Campo;
  const Armazem = C.armazem('medicoes');




  /* ============================================================
     3. Estado
     ============================================================ */

  const ITENS = window.PDF101 ? PDF101.ITENS : [];

  let atual = null;          // a medição aberta
  let salvando = null;       // debounce
  const previas = {};        // id da foto -> objectURL, para não vazar memória



  function el(id) { return document.getElementById(id); }

  function medicaoNova() {
    const eu = window.dalmobileAuth && window.dalmobileAuth.usuario;

    return {
      id: C.novoId('med'),
      remoto: null,
      enviado: false,
      versao: 0,
      marcos: [],
      origem: null,
      autor: eu ? eu.id : null,
      cliente: '', contrato: '',
      loja: (window.EU && window.EU.loja) || 'sjc',
      criado_em: C.agora(),
      atualizado_em: C.agora(),
      dados: {
        tipoContrato: 'total',
        ambientes: [{ nome: '', checklist: '', projetoDefinido: null }],
        observacao: '',
        itens: {},
        outros: '',
        parecerFinal: '',
        caminhoInapto: '',
        ambientesNaoAptos: '',
        tecnico: (eu && eu.user_metadata && eu.user_metadata.nome) || ''
      }
    };
  }


  /* ============================================================
     4. Conexão
     ------------------------------------------------------------
     A tela nunca mente sobre isso. O medidor precisa saber, na
     obra, se o que ele preencheu já saiu do aparelho — porque
     se não saiu e o celular cair na massa, acabou.
     ============================================================ */


  async function pintarRede() {
    const faixa = el('rede');
    const pendentes = (await Armazem.todas()).filter(function (m) { return !m.enviado && !m.removido; }).length;

    faixa.className = 'rede';
    faixa.innerHTML = '';

    if (!navigator.onLine) {
      faixa.classList.add('off');
      faixa.innerHTML = 'Sem internet — tudo continua funcionando.' +
        '<b>O que você preencher fica salvo aqui e sobe sozinho quando o sinal voltar. ' +
        'O PDF você gera mesmo offline.</b>';
      return;
    }

    if (pendentes) {
      faixa.classList.add('pendente');
      faixa.innerHTML = pendentes + (pendentes > 1 ? ' medições ainda não subiram.' : ' medição ainda não subiu.') +
        '<b>Elas sobem sozinhas; se demorar, é só abrir a medição que ela tenta de novo.</b>';
    }
  }

  window.addEventListener('online',  function () { pintarRede(); sincronizarTudo(); });
  window.addEventListener('offline', pintarRede);


  /* ============================================================
     5. Lista
     ============================================================ */

  const TIPO_DOC = 'medicao';
  const ROTULO_EQUIPE = 'Medições da equipe';

  async function montarPdfDe(doc) {
    const bytes = await PDF101.montar(doc);
    return { nome: PDF101.nomeDoArquivo(doc),
             blob: new Blob([bytes], { type: 'application/pdf' }) };
  }

  /* ============================================================
     Documentos da equipe
     ------------------------------------------------------------
     A lista de cima é o que está NESTE aparelho, que é o que o
     medidor edita. Esta é o que está no servidor, que é só
     consulta — e por isso não tem botão de editar, só de baixar
     o PDF, que o navegador remonta a partir dos dados.

     Aparece só para gerente e administrador. Para o consultor a
     seção inteira some: a lista dele já é a de cima.

     E não aparece offline. Sem rede não há o que mostrar, e uma
     seção vazia com um aviso de erro no meio da tela de campo
     seria ruído num lugar onde ruído atrapalha.
     ============================================================ */

  async function desenharEquipe() {
    const caixa = el('equipe');
    const titulo = el('equipe-titulo');
    const sub = el('equipe-sub');

    const eu = await C.eu();
    const podeVer = eu.admin || eu.gerente;

    if (!podeVer || !C.temServidor()) {
      titulo.classList.add('oculto');
      sub.classList.add('oculto');
      caixa.innerHTML = '';
      return;
    }

    titulo.classList.remove('oculto');
    sub.classList.remove('oculto');
    el('equipe-rotulo').textContent = ROTULO_EQUIPE;
    sub.textContent = eu.admin
      ? 'Todas as lojas. Só consulta — para editar, use o aparelho de quem preencheu.'
      : 'Da sua loja. Só consulta — para editar, use o aparelho de quem preencheu.';

    caixa.innerHTML = '<p class="vazio-msg">Carregando...</p>';

    const linhas = await C.listarDaEquipe(TIPO_DOC);

    if (linhas === null) {
      caixa.innerHTML = '<p class="vazio-msg">Não consegui carregar agora.</p>';
      return;
    }

    /* O que já está neste aparelho sai da lista: apareceria duas
       vezes, uma editável e outra não, o que confunde mais do
       que ajuda. */
    const meus = (await Armazem.todas())
      .map(function (m) { return m.remoto; })
      .filter(Boolean);

    const outros = linhas.filter(function (l) { return meus.indexOf(l.id) === -1; });

    if (!outros.length) {
      caixa.innerHTML = '<p class="vazio-msg">Nada da equipe por aqui ainda.</p>';
      return;
    }

    caixa.innerHTML = '';

    outros.forEach(function (d) {
      caixa.appendChild(cartaoDaEquipe(d, eu));
    });
  }

  function cartaoDaEquipe(d, eu) {
    const cartao = document.createElement('div');
    cartao.className = 'ficha';

    const meu = d.autor === eu.id;

    const corpo = document.createElement('div');
    corpo.style.padding = '15px 16px';
    corpo.innerHTML =
      '<h3>' + C.escapar(d.cliente || 'Sem nome') + '</h3>' +
      '<p>' + C.escapar(d.contrato || 'sem contrato') + ' · ' +
              (d.loja === 'cgt' ? 'Caraguatatuba' : 'São José dos Campos') + ' · ' +
              C.dataCurta(d.atualizado_em) + '</p>' +
      '<div class="tags">' +
        C.pintarEtiqueta(C.etiquetaParecer(d)) +
        C.pintarEtiqueta(C.etiquetaEstado(d)) +
        (d.autorNome
          ? '<span class="autor' + (meu ? ' meu' : '') + '">' +
            C.escapar(meu ? 'você' : d.autorNome) + '</span>'
          : '') +
      '</div>';

    cartao.appendChild(corpo);

    const acoes = document.createElement('div');
    acoes.className = 'acoes';
    acoes.style.paddingTop = '0';

    const baixar = document.createElement('button');
    baixar.textContent = 'baixar PDF';
    baixar.style.borderColor = 'var(--line-2)';
    baixar.style.color = 'var(--ink-2)';

    baixar.onclick = async function () {
      baixar.disabled = true;
      baixar.textContent = 'gerando…';

      try {
        /* As fotos ficam no aparelho de quem preencheu, não no
           servidor. O PDF sai completo no texto e sem imagem —
           e diz isso, para ninguém achar que não houve foto. */
        const pdf = await montarPdfDe({
          cliente: d.cliente, contrato: d.contrato, loja: d.loja,
          dados: d.dados, preenchido_em: d.atualizado_em, fotos: {}
        });
        await C.entregar(null, pdf.blob, pdf.nome);
      } catch (erro) {
        console.error(erro);
        alert('Não consegui gerar o PDF. ' + (erro.message || ''));
      } finally {
        baixar.disabled = false;
        baixar.textContent = 'baixar PDF';
      }
    };

    acoes.appendChild(baixar);

    if (eu.admin) {
      const apagar = document.createElement('button');
      apagar.textContent = 'apagar do sistema';

      apagar.onclick = async function () {
        if (!confirm('Mandar o documento de ' + (d.cliente || 'sem nome') +
                     ' para a lixeira?\n\nDá para restaurar na aba Contas.')) return;

        apagar.disabled = true;
        apagar.textContent = 'apagando…';

        try {
          await C.mandarParaLixeira(d.id);
          desenharEquipe();
        } catch (erro) {
          alert(erro.message);
          apagar.disabled = false;
          apagar.textContent = 'apagar do sistema';
        }
      };

      acoes.appendChild(apagar);
    }

    cartao.appendChild(acoes);
    return cartao;
  }

  async function mostrarLista() {
    el('tela-ficha').classList.add('oculto');
    el('tela-lista').classList.remove('oculto');
    el('barra').classList.add('oculto');
    atual = null;
    limparPrevias();

    await pintarRede();
    desenharEquipe();

    const todas = (await Armazem.todas()).sort(function (a, b) {
      return String(b.atualizado_em).localeCompare(String(a.atualizado_em));
    });

    const caixa = el('lista');

    if (!todas.length) {
      caixa.innerHTML = '<p class="vazio-msg">Nenhuma medição ainda.<br>' +
        'Toque em <b>Nova medição</b> antes de sair para a obra — ' +
        'assim a tela já fica guardada no aparelho.</p>';
      return;
    }

    caixa.innerHTML = '';

    const souAdmin = (await C.eu()).admin;

    todas.forEach(function (m) {
      const resumo = contar(m);

      const cartao = document.createElement('div');
      cartao.className = 'ficha' + (m.removido ? ' removido' : '');

      const abrir = document.createElement('button');
      abrir.className = 'abrir';
      abrir.onclick = function () { abrirFicha(m.id); };

      abrir.innerHTML =
        '<h3>' + C.escapar(m.cliente || 'Sem nome') + '</h3>' +
        '<p>' + C.escapar(m.contrato || 'sem contrato') + ' · ' +
                (m.loja === 'cgt' ? 'Caraguatatuba' : 'São José dos Campos') + ' · ' +
                C.dataCurta(m.atualizado_em) + '</p>' +
        '<div class="tags">' +
          etiquetaDoEnvio(m) +
          (m.versao ? '<span class="tag">versão ' + m.versao + '</span>' : '') +
          ((m.marcos || []).length
            ? '<span class="tag aviso">' + m.marcos.length + ' versão a subir</span>' : '') +
          C.pintarEtiqueta(C.etiquetaParecer({ tipo: TIPO_DOC, dados: m.dados })) +
          (resumo.faltam ? '<span class="tag">' + resumo.faltam + ' sem resposta</span>' : '') +
          (resumo.reprovados ? '<span class="tag erro">' + resumo.reprovados + ' não apto</span>' : '') +
          (!resumo.faltam && !resumo.reprovados ? '<span class="tag ok">checklist completo</span>' : '') +
        '</div>';

      cartao.appendChild(abrir);

      if (souAdmin && m.remoto && !m.removido) {
        cartao.appendChild(acaoDeApagar(m, 'medição'));
      }

      caixa.appendChild(cartao);
    });
  }


  /* Três estados, não dois. O terceiro só aparece depois que a
     sincronia descobre que o administrador mandou a ficha para a
     lixeira — e é importante que o medidor veja isso, em vez de
     achar que o registro dele continua valendo. */
  function etiquetaDoEnvio(m) {
    if (m.removido) return '<span class="tag erro">removido pelo administrador</span>';
    return m.enviado ? '<span class="tag ok">no sistema</span>'
                     : '<span class="tag aviso">só neste aparelho</span>';
  }

  /* Só para administrador, e só no que já subiu: o que ainda está
     no aparelho se resolve com o "Apagar" de dentro da ficha. */
  function acaoDeApagar(m, oQue) {
    const linha = document.createElement('div');
    linha.className = 'acoes';

    const b = document.createElement('button');
    b.textContent = 'apagar do sistema';

    b.onclick = async function () {
      if (!confirm('Mandar a ' + oQue + ' de ' + (m.cliente || 'sem nome') +
                   ' para a lixeira?\n\n' +
                   'Ela some das listas na hora. Dá para restaurar depois, ' +
                   'na aba Contas da Central.')) return;

      b.disabled = true;
      b.textContent = 'apagando…';

      try {
        await C.mandarParaLixeira(m.remoto);
        m.removido = true;
        await Armazem.salvar(m);
        mostrarLista();
      } catch (erro) {
        alert(erro.message);
        b.disabled = false;
        b.textContent = 'apagar do sistema';
      }
    };

    linha.appendChild(b);
    return linha;
  }

  function contar(m) {
    const itens = (m.dados && m.dados.itens) || {};
    let faltam = 0, reprovados = 0;

    ITENS.forEach(function (i) {
      const s = (itens[i.letra] || {}).situacao;
      if (!s) faltam++;
      else if (s === 'nao-apto') reprovados++;
    });

    return { faltam: faltam, reprovados: reprovados };
  }


  /* ============================================================
     6. Ficha
     ============================================================ */

  async function abrirFicha(id) {
    const m = await Armazem.ler(id);
    if (!m) return mostrarLista();

    atual = m;
    limparPrevias();

    el('tela-lista').classList.add('oculto');
    el('tela-ficha').classList.remove('oculto');
    el('barra').classList.remove('oculto');
    window.scrollTo(0, 0);

    el('f-cliente').value   = m.cliente || '';
    el('f-contrato').value  = m.contrato || '';
    el('f-loja').value      = m.loja || 'sjc';
    el('f-tecnico').value   = m.dados.tecnico || '';
    el('f-tipo').value      = m.dados.tipoContrato || 'total';
    el('f-obs').value       = m.dados.observacao || '';
    el('f-outros').value    = m.dados.outros || '';
    el('f-nao-aptos').value = m.dados.ambientesNaoAptos || '';

    desenharAmbientes();
    desenharChecklist();
    pintarParecerFinal();
    pintarEstado();
    pintarReabertura();

    sincronizar(m);
  }

  /* ---------- ambientes ---------- */

  function desenharAmbientes() {
    const caixa = el('ambientes');
    caixa.innerHTML = '';

    (atual.dados.ambientes || []).forEach(function (amb, i) {
      const d = document.createElement('div');
      d.className = 'amb';

      d.innerHTML =
        '<div class="amb-topo">' +
          '<input type="text" placeholder="Ex.: Cozinha" value="' + C.escapar(amb.nome || '') + '">' +
          '<button type="button" title="Remover">×</button>' +
        '</div>' +
        '<div class="mini">' +
          '<div>' +
            '<label class="rot">Checklist</label>' +
            '<select>' +
              '<option value="">Não informado</option>' +
              '<option value="anexo">Em anexo</option>' +
              '<option value="nao-se-aplica">Não se aplica</option>' +
            '</select>' +
          '</div>' +
          '<div>' +
            '<label class="rot">Projeto definido?</label>' +
            '<select>' +
              '<option value="">Não informado</option>' +
              '<option value="sim">Sim — cores e modelos</option>' +
              '<option value="nao">Não</option>' +
            '</select>' +
          '</div>' +
        '</div>';

      const nome = d.querySelector('input');
      const selects = d.querySelectorAll('select');

      selects[0].value = amb.checklist || '';
      selects[1].value = amb.projetoDefinido === true ? 'sim'
                       : amb.projetoDefinido === false ? 'nao' : '';

      nome.oninput = function () { atual.dados.ambientes[i].nome = nome.value; guardar(); };
      selects[0].onchange = function () { atual.dados.ambientes[i].checklist = selects[0].value; guardar(); };
      selects[1].onchange = function () {
        const v = selects[1].value;
        atual.dados.ambientes[i].projetoDefinido = v === 'sim' ? true : v === 'nao' ? false : null;
        guardar();
      };

      d.querySelector('button').onclick = function () {
        atual.dados.ambientes.splice(i, 1);
        if (!atual.dados.ambientes.length) {
          atual.dados.ambientes.push({ nome: '', checklist: '', projetoDefinido: null });
        }
        guardar();
        desenharAmbientes();
      };

      caixa.appendChild(d);
    });
  }

  /* ---------- checklist ---------- */

  function desenharChecklist() {
    const caixa = el('checklist');
    caixa.innerHTML = '';

    ITENS.forEach(function (item) {
      caixa.appendChild(montarItem(item));
    });
  }

  function montarItem(item) {
    const resposta = atual.dados.itens[item.letra] ||
                     (atual.dados.itens[item.letra] = { situacao: '', parecer: '', motivo: '', fotos: [] });

    const d = document.createElement('div');
    d.className = 'item' + (resposta.situacao ? ' ' + resposta.situacao : '');

    d.innerHTML =
      '<header><span class="letra">' + item.letra + ')</span><h3>' + C.escapar(item.titulo) + '</h3></header>' +
      '<button type="button" class="porque">por que isso importa</button>' +
      '<p class="explica">' + C.escapar(item.texto) + '</p>' +
      '<div class="escolha">' +
        '<button type="button" class="sim" data-v="apto">Apto</button>' +
        '<button type="button" class="nao" data-v="nao-apto">Não apto</button>' +
        '<button type="button" class="na"  data-v="nao-se-aplica">Não se aplica</button>' +
      '</div>' +
      '<div class="anexos">' +
        '<label class="anexar"><span>+</span> Foto' +
          '<input type="file" accept="image/*" capture="environment" hidden multiple>' +
        '</label>' +
        '<div class="fotos"></div>' +
      '</div>' +
      '<div class="detalhe" hidden>' +
        '<p class="exige oculto">Item reprovado. Escreva o que está errado — ' +
          'junto com a foto, é esse registro que sustenta o termo que o cliente vai assinar.</p>' +
        '<div class="campo"><label class="rot">Parecer do técnico</label>' +
          '<textarea class="p" placeholder="O que você encontrou"></textarea></div>' +
        '<div class="campo" style="margin-bottom:0"><label class="rot">Motivo</label>' +
          '<textarea class="m" placeholder="Por que isso impede ou atrapalha a medição"></textarea></div>' +
      '</div>';

    const porque = d.querySelector('.porque');
    porque.onclick = function () { porque.classList.toggle('aberto'); };

    const detalhe = d.querySelector('.detalhe');
    const exige = d.querySelector('.exige');
    const parecer = d.querySelector('textarea.p');
    const motivo = d.querySelector('textarea.m');
    const fotos = d.querySelector('.fotos');
    const anexar = d.querySelector('.anexar');

    parecer.value = resposta.parecer || '';
    motivo.value = resposta.motivo || '';

    parecer.oninput = function () { resposta.parecer = parecer.value; guardar(); };
    motivo.oninput  = function () { resposta.motivo  = motivo.value;  guardar(); };

    d.querySelectorAll('.escolha button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(resposta.situacao === b.dataset.v));

      b.onclick = function () {
        /* Tocar de novo no que já estava marcado desmarca. Sem
           isso, um toque errado em "Apto" não tem volta — e um
           apto que ninguém quis dizer é pior que um vazio. */
        resposta.situacao = (resposta.situacao === b.dataset.v) ? '' : b.dataset.v;

        d.querySelectorAll('.escolha button').forEach(function (o) {
          o.setAttribute('aria-pressed', String(resposta.situacao === o.dataset.v));
        });

        d.className = 'item' + (resposta.situacao ? ' ' + resposta.situacao : '');
        pintar();
        guardar();
        pintarEstado();
      };
    });

    /* O anexo de foto não entra nesta conta: ele fica sempre
       visível. Aqui só se decide o que fazer com os campos de
       texto e com a cobrança do item reprovado. */
    function pintar() {
      const reprovado = resposta.situacao === 'nao-apto';

      detalhe.hidden = !(reprovado || resposta.parecer || resposta.motivo);
      exige.classList.toggle('oculto', !reprovado);
      anexar.classList.toggle('vazio', !(resposta.fotos || []).length);
    }

    anexar.querySelector('input').onchange = async function () {
      const novas = await C.receber(this.files, function () {
        avisar('Não consegui usar uma das fotos.');
      });
      this.value = '';

      resposta.fotos = (resposta.fotos || []).concat(novas);
      await guardar();
      desenharFotos(fotos, resposta, pintar);
      pintar();
    };

    desenharFotos(fotos, resposta, pintar);
    pintar();

    return d;
  }

  /* ---------- fotos do item ---------- */

  function desenharFotos(caixa, resposta, aoMudar) {
    caixa.innerHTML = '';

    (resposta.fotos || []).forEach(function (f, i) {
      const d = document.createElement('div');
      d.className = 'foto';
      d.innerHTML =
        '<img alt="">' +
        '<button type="button" class="tirar" title="Remover">×</button>' +
        '<input type="text" placeholder="Legenda" value="' + C.escapar(f.legenda || '') + '">';

      const img = d.querySelector('img');

      C.fotos.ler(f.id).then(function (reg) {
        if (!reg) return;
        if (previas[f.id]) URL.revokeObjectURL(previas[f.id]);
        previas[f.id] = URL.createObjectURL(reg.blob);
        img.src = previas[f.id];
      });

      d.querySelector('input').oninput = function () {
        resposta.fotos[i].legenda = this.value;
        guardar();
      };

      d.querySelector('.tirar').onclick = function () {
        C.fotos.apagar(f.id);
        if (previas[f.id]) { URL.revokeObjectURL(previas[f.id]); delete previas[f.id]; }
        resposta.fotos.splice(i, 1);
        guardar();
        desenharFotos(caixa, resposta, aoMudar);
        if (aoMudar) aoMudar();
      };

      caixa.appendChild(d);
    });
  }

  /* O campo de arquivo com capture="environment" abre a câmera
     traseira direto no celular; no computador abre o seletor de
     arquivos. Um controle só, nos dois lugares. */

  /* ============================================================
     Reabertura — é aqui que a data de abertura reseta
     ------------------------------------------------------------
     E ela não é alterada em lugar nenhum: nasce uma ficha nova,
     com data nova, apontando para a que reprovou. A anterior
     fica intacta, com o parecer, as fotos e o técnico.

     Quem perguntar depois "por que o prazo deste contrato
     começa em novembro se ele fechou em setembro?" segue o elo
     e encontra um parecer de inaptidão assinado — em vez de uma
     data que alguém poderia ter mudado à mão.

     Só aparece quando faz sentido: medição reprovada, cliente
     indo corrigir, e documento já no sistema. Reabrir o que
     ainda não subiu não teria o que encadear.
     ============================================================ */

  function pintarReabertura() {
    const d = atual.dados;
    const caixa = el('caixa-reabrir');
    const veioDe = el('veio-de');

    const cabe = atual.remoto &&
                 d.parecerFinal === 'nao-aptos' &&
                 d.caminhoInapto === 'corrigir';

    caixa.classList.toggle('oculto', !cabe);

    if (cabe) {
      el('reabrir-porque').textContent =
        'Quando o cliente ajustar o que foi reprovado, abra a nova medição por aqui. ' +
        'Esta ficha continua guardada como está, e a nova nasce com data de abertura ' +
        'nova — é ela que passa a valer para o prazo.';
    }

    veioDe.classList.toggle('oculto', !atual.origem);
    if (atual.origem) {
      veioDe.innerHTML = '<b>Esta medição substitui uma anterior</b>, reprovada na visita passada. ' +
        'O prazo do contrato conta a partir da abertura desta.';
    }
  }

  el('reabrir').onclick = async function () {
    if (!atual || !atual.remoto) return;

    if (!confirm('Abrir uma nova medição para ' + (atual.cliente || 'este cliente') + '?\n\n' +
                 'Esta ficha fica guardada como está. A nova começa com o checklist em ' +
                 'branco e com data de abertura nova.')) return;

    const botao = this;
    botao.disabled = true;
    botao.textContent = 'Abrindo…';

    try {
      const novoRemoto = await C.reabrirMedicao(atual.remoto);

      /* A ficha nasceu no servidor. Aqui no aparelho nasce a
         cópia que o medidor vai preencher na próxima visita,
         já amarrada àquela. */
      const nova = medicaoNova();
      nova.remoto = novoRemoto;
      nova.enviado = true;
      nova.origem = atual.remoto;
      nova.cliente = atual.cliente;
      nova.contrato = atual.contrato;
      nova.loja = atual.loja;
      nova.dados.tecnico = atual.dados.tecnico;
      nova.dados.tipoContrato = atual.dados.tipoContrato;
      nova.dados.ambientes = JSON.parse(JSON.stringify(atual.dados.ambientes || []));

      await Armazem.salvar(nova);
      await abrirFicha(nova.id);

    } catch (erro) {
      alert(erro.message);
      botao.disabled = false;
      botao.textContent = 'Reabrir medição para nova visita';
    }
  };


  /* ---------- parecer final ---------- */

  function pintarParecerFinal() {
    const botoes = el('parecer-final').querySelectorAll('button');

    botoes.forEach(function (b) {
      b.setAttribute('aria-pressed', String(atual.dados.parecerFinal === b.dataset.v));

      b.onclick = function () {
        atual.dados.parecerFinal = (atual.dados.parecerFinal === b.dataset.v) ? '' : b.dataset.v;
        pintarParecerFinal();
        guardar();
        pintarEstado();
      };
    });

    const naoApto = atual.dados.parecerFinal === 'nao-aptos';

    el('campo-nao-aptos').hidden = !naoApto;
    el('campo-caminho').hidden = !naoApto;

    /* Trocou para "aptos": a escolha do caminho perde o sentido
       e não pode ficar guardada atrás da tela, senão volta a
       valer se alguém trocar de novo. */
    if (!naoApto && atual.dados.caminhoInapto) atual.dados.caminhoInapto = '';

    el('caminho-inapto').querySelectorAll('button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(atual.dados.caminhoInapto === b.dataset.v));

      b.onclick = function () {
        atual.dados.caminhoInapto =
          (atual.dados.caminhoInapto === b.dataset.v) ? '' : b.dataset.v;
        pintarParecerFinal();
        guardar();
      };
    });

    pintarNotaDoTermo();
    pintarReabertura();
  }

  /* O medidor precisa saber, ANTES de gerar, o que vai sair no
     PDF — porque disso depende se ele pode ir embora ou se tem
     de colher assinatura ali mesmo. São três documentos
     diferentes, e só um deles dispensa o cliente. */
  function pintarNotaDoTermo() {
    const d = atual.dados;
    const nota = el('nota-termo');

    if (d.parecerFinal === 'aptos') {
      nota.innerHTML = '<b>O PDF vai sair com o termo de ciência de início de prazos.</b> ' +
        'O cliente precisa assinar — é a assinatura dele que faz o prazo de entrega começar.';
      return;
    }

    if (d.parecerFinal === 'nao-aptos') {
      if (d.caminhoInapto === 'prosseguir') {
        nota.innerHTML = '<b>O PDF vai sair com o termo de responsabilidade.</b> ' +
          'O cliente precisa assinar antes de você sair da obra: é ele assumindo os ' +
          'riscos de seguir nas condições que você fotografou.';
        return;
      }
      if (d.caminhoInapto === 'corrigir') {
        nota.innerHTML = '<b>O PDF vai sair como parecer de suspensão de prazos.</b> ' +
          'O cliente <b>não assina</b> — quem assina é a Dalmóbile. O documento vai ' +
          'para o e-mail dele como comprovação da visita, e o prazo fica parado.';
        return;
      }
      nota.innerHTML = '<b>Falta dizer o que o cliente decidiu.</b> ' +
        'Sem isso o PDF sai sem termo nenhum, avisando que a escolha ficou pendente.';
      return;
    }

    nota.innerHTML = 'Marque o parecer final para saber qual documento vai sair.';
  }


  /* ============================================================
     7. Salvar
     ============================================================ */

  function colher() {
    if (!atual) return;
    atual.cliente  = el('f-cliente').value.trim();
    atual.contrato = el('f-contrato').value.trim();
    atual.loja     = el('f-loja').value;

    atual.dados.tecnico           = el('f-tecnico').value.trim();
    atual.dados.tipoContrato      = el('f-tipo').value;
    atual.dados.observacao        = el('f-obs').value;
    atual.dados.outros            = el('f-outros').value;
    atual.dados.ambientesNaoAptos = el('f-nao-aptos').value;
  }

  async function guardar() {
    if (!atual) return;
    colher();
    atual.atualizado_em = C.agora();
    atual.enviado = false;
    await Armazem.salvar(atual);
    pintarEstado();
    pintarNotaDoTermo();

    clearTimeout(salvando);

    /* Guarda a ficha, não a variável. Quando o atraso vence, o
       medidor já pode ter voltado para a lista — e aí 'atual' é
       nulo, a sincronia dispara contra nada e o que estava para
       subir fica parado no aparelho sem ninguém perceber. */
    const pendente = atual;
    salvando = setTimeout(function () { sincronizar(pendente); }, 4000);
  }

  ['f-cliente','f-contrato','f-tecnico','f-obs','f-outros','f-nao-aptos'].forEach(function (id) {
    el(id).addEventListener('input', guardar);
  });
  ['f-loja','f-tipo'].forEach(function (id) {
    el(id).addEventListener('change', guardar);
  });

  function pintarEstado() {
    if (!atual) return;
    const r = contar(atual);

    el('estado').innerHTML = r.faltam
      ? '<b>' + r.faltam + '</b> ite' + (r.faltam > 1 ? 'ns' : 'm') + ' sem resposta'
      : (atual.enviado ? 'Salvo e no sistema' : 'Salvo neste aparelho');
  }


  /* ============================================================
     8. Sincronia
     ------------------------------------------------------------
     Melhor esforço, sempre. Falhou? O rascunho local continua
     sendo a verdade e tenta de novo depois. Em nenhum caminho
     desta tela o medidor fica impedido de trabalhar porque o
     servidor não respondeu.
     ============================================================ */

  async function sincronizar(m) {
    if (!m || m.enviado) return;

    /* Removido pelo administrador: não insiste. Sem isto o
       aparelho reenviaria a cada abertura, para sempre, e o
       banco devolveria sempre o mesmo 'apagado'. */
    if (m.removido) return;

    const sb = C.temServidor();
    if (!sb) return;

    /* As fotos ficam no aparelho nesta versão: elas vão para o
       PDF, que é o documento de valor. Subir imagem pede o
       Storage do Supabase e uma política própria — fica para
       quando a assinatura entrar. */
    const linha = {
      tipo: 'medicao',
      cliente: m.cliente || '',
      contrato: m.contrato || '',
      loja: m.loja,
      dados: m.dados,
      status: 'preenchido',
      preenchido_em: m.atualizado_em
    };

    try {
      /* A ficha criada em obra pode subir dias depois. Sem mandar
         a data de abertura no insert, ela viraria a data da
         SINCRONIA — e com ela o prazo contratual escorregaria
         para frente sozinho. No update ela nem vai: o banco a
         tranca, e é essa a intenção. */
      const r = m.remoto
        ? await sb.from('formularios').update(linha).eq('id', m.remoto).select('id,status').single()
        : await sb.from('formularios')
                  .insert(Object.assign({ pedido_em: m.criado_em }, linha))
                  .select('id,status').single();

      if (r.error) throw r.error;

      m.remoto = r.data.id;
      m.enviado = true;

      /* O banco devolve o estado DEPOIS do gatilho. Se voltou
         'apagado', o administrador mandou esta ficha para a
         lixeira: o conteúdo foi gravado, mas ela não revive. É
         assim que este aparelho fica sabendo. */
      m.removido = r.data.status === 'apagado';

      await Armazem.salvar(m);
      await C.enviarMarcos(m, Armazem);
      await Armazem.salvar(m);

      pintarEstado();
      pintarRede();

    } catch (erro) {
      console.warn('Não subiu agora; fica para a próxima.', erro);
    }
  }

  async function sincronizarTudo() {
    const todas = await Armazem.todas();
    for (const m of todas) {
      if (!m.enviado && !m.removido) await sincronizar(m);
    }
    pintarRede();
    if (!el('tela-lista').classList.contains('oculto')) mostrarLista();
  }


  /* ============================================================
     9. PDF
     ============================================================ */

  /* Duas ações, porque são dois desejos diferentes e só o
     medidor sabe qual é o dele naquele momento:

       Baixar  → o arquivo cai na pasta de downloads / em Arquivos
       Enviar  → abre o menu do sistema (WhatsApp, Drive, e-mail)

     A primeira versão chamava o menu de compartilhar sozinha,
     antes de baixar. No celular acerta; no computador vira um
     menu que ninguém pediu. Adivinhar saiu pior que perguntar
     com dois botões. */

  async function montarPdf() {
    colher();

      /* Carrega as fotos do aparelho e passa como bytes. */
      const fotos = {};
      for (const item of ITENS) {
        const r = atual.dados.itens[item.letra];
        for (const f of ((r && r.fotos) || [])) {
          const reg = await C.fotos.ler(f.id);
          if (reg) fotos[f.id] = new Uint8Array(await reg.blob.arrayBuffer());
        }
      }

      const bytes = await PDF101.montar({
        cliente: atual.cliente,
        contrato: atual.contrato,
        loja: atual.loja,
        dados: atual.dados,
        preenchido_em: atual.atualizado_em,
        fotos: fotos
      });

    /* Gerar o PDF é o evento que vira versão: foi este arquivo
       que alguém imprimiu ou mandou. O marco fica no aparelho e
       sobe na próxima sincronia, com a data de hoje — não a de
       quando houver sinal. */
    C.anotarMarco(atual, 'pdf', await C.hashDoPdf(bytes));
    await guardar();

    return {
      nome: PDF101.nomeDoArquivo(atual),
      blob: new Blob([bytes], { type: 'application/pdf' })
    };
  }

  /* Envolve as duas ações: trava o botão, avisa o erro, destrava
     de novo aconteça o que acontecer. */
  function comPdf(botao, rotulo, acao) {
    return async function () {
      if (!atual) return;

      botao.disabled = true;
      botao.textContent = 'Gerando…';

      try {
        const pdf = await montarPdf();
        await acao(pdf);
      } catch (erro) {
        console.error(erro);
        avisar('Não consegui gerar o PDF. ' + (erro.message || ''));
      } finally {
        botao.disabled = false;
        botao.textContent = rotulo;
      }
    };
  }

  /* SALVAR — a pessoa escolhe onde.
     ------------------------------------------------------------
     Onde o navegador souber (Chrome e Edge no computador), abre
     o diálogo de salvar de verdade: o medidor escolhe a pasta.
     Se ele usa o Google Drive para computador, a pasta do Drive
     aparece ali como qualquer outra — é assim que o PDF vai
     parar no Drive sem precisar de API, credencial no servidor
     nem permissão que expira.

     Onde não souber (Safari, Firefox, celular), baixa do jeito
     comum. Nunca fica sem saída.

     A ORDEM AQUI NÃO É ARBITRÁRIA: o diálogo é pedido ANTES de
     montar o PDF. Ele só abre enquanto o toque do medidor ainda
     "vale" para o navegador, e isso dura poucos segundos — se a
     gente gerasse primeiro, um documento com muitas fotos
     estouraria esse prazo e o diálogo seria recusado. */

  el('salvar').onclick = async function () {
    if (!atual) return;

    const botao = this;
    colher();

    const destino = await C.escolherPasta(PDF101.nomeDoArquivo(atual));
    if (destino === 'cancelado') return;

    botao.disabled = true;
    botao.textContent = 'Gerando…';

    try {
      const pdf = await montarPdf();
      await C.entregar(destino, pdf.blob, pdf.nome);
    } catch (erro) {
      console.error(erro);
      avisar('Não consegui salvar o PDF. ' + (erro.message || ''));
    } finally {
      botao.disabled = false;
      botao.textContent = 'Salvar PDF';
    }
  };

  el('enviar').onclick = comPdf(el('enviar'), 'Enviar', function (pdf) {
    return C.compartilhar(pdf.blob, pdf.nome);
  });

  /* "Enviar" só aparece onde o aparelho sabe mandar arquivo.
     Botão que não faz nada é pior que botão que não existe. */
  el('enviar').hidden = !C.podeCompartilharArquivo();


  /* ============================================================
     10. Botões gerais
     ============================================================ */

  el('nova').onclick = async function () {
    const m = medicaoNova();
    await Armazem.salvar(m);
    abrirFicha(m.id);
  };

  el('voltar-lista').onclick = async function () {
    await guardar();
    mostrarLista();
  };

  el('add-ambiente').onclick = function () {
    atual.dados.ambientes.push({ nome: '', checklist: '', projetoDefinido: null });
    guardar();
    desenharAmbientes();
  };

  el('apagar').onclick = async function () {
    if (!atual) return;

    const aviso = atual.enviado
      ? 'Apagar esta medição deste aparelho? Ela já subiu para o sistema e continua lá.'
      : 'Apagar esta medição? Ela ainda NÃO subiu para o sistema — isso não tem volta.';

    if (!confirm(aviso)) return;

    for (const item of ITENS) {
      const r = atual.dados.itens[item.letra];
      for (const f of ((r && r.fotos) || [])) await C.fotos.apagar(f.id);
    }

    await Armazem.apagar(atual.id);
    mostrarLista();
  };


  /* ============================================================
     11. Miudezas
     ============================================================ */



  function avisar(texto) { alert(texto); }

  function limparPrevias() {
    Object.keys(previas).forEach(function (id) {
      URL.revokeObjectURL(previas[id]);
      delete previas[id];
    });
  }

  /* Guarda antes de a aba sumir — no celular, trocar de app ou
     atender uma ligação é o jeito mais comum de "fechar" a
     página, e nenhum desses dispara o unload. */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && atual) guardar();
  });


  /* ============================================================
     12. Partida
     ============================================================ */

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('Service worker não registrou; a tela não vai abrir offline.', e);
    });
  }

  if (!window.PDF101) {
    avisar('O gerador de PDF não carregou. Abra a tela uma vez com internet.');
  }

  mostrarLista();
  sincronizarTudo();

})();
</script>
