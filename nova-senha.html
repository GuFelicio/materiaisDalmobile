<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dalmóbile · Nova senha</title>
<style>
  :root {
    --bg: #f2f2f0; --card: #fff; --ink: #141618; --ink-2: #4a5054;
    --muted: #8a9094; --line: #e0e1df; --line-2: #c9cbc8;
    --ok: #1c6b3f; --erro: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .caixa {
    width: 100%; max-width: 360px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px;
  }
  .tracos { display: flex; gap: 4px; margin-bottom: 16px; }
  .tracos i { width: 16px; height: 2px; background: var(--ink); display: block; }
  .tracos i:nth-child(2) { width: 9px; opacity: .55; }
  .tracos i:nth-child(3) { width: 5px; opacity: .3; }
  h1 { font-size: 19px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
  p.sub { font-size: 13px; line-height: 1.5; color: var(--muted); margin: 0 0 22px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 0 0 5px; }
  input {
    width: 100%; margin-bottom: 14px; padding: 12px 13px;
    font-size: 15px; font-family: inherit; color: var(--ink);
    border: 1px solid var(--line-2); border-radius: 9px; background: #fff;
  }
  input:focus { outline: none; border-color: var(--ink); }
  button {
    width: 100%; padding: 14px; border: 0; border-radius: 9px;
    background: var(--ink); color: #fff;
    font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  .recado { margin: 16px 0 0; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
  .recado.erro { color: var(--erro); }
  .recado.ok   { color: var(--ok); }
  a.voltar {
    display: block; margin-top: 16px; text-align: center;
    font-size: 12px; color: var(--muted); text-decoration: none;
  }
  a.voltar:hover { color: var(--ink); }
</style>
</head>
<body>

<div class="caixa">
  <div class="tracos"><i></i><i></i><i></i></div>
  <h1>Nova senha</h1>
  <p class="sub">Escolha a senha que você vai usar na Central de Peças.</p>

  <label for="senha">Senha nova</label>
  <input id="senha" type="password" autocomplete="new-password" placeholder="pelo menos 8 caracteres">

  <label for="repete">Repita a senha</label>
  <input id="repete" type="password" autocomplete="new-password" placeholder="••••••••">

  <button id="salvar" type="button">Salvar senha</button>

  <p class="recado" id="recado"></p>
  <a class="voltar" href="./">Voltar para a Central</a>
</div>

<script>window.AUTH_SEM_TRAVA = true;</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
/* Esta página NÃO usa a trava do auth.js: quem cai aqui está, por
   definição, sem senha para entrar. O auth.js entra só para
   reaproveitar o endereço e a chave do projeto. */

const el = (id) => document.getElementById(id);
const recado = el('recado');

const dizer = (texto, classe) => {
  recado.textContent = texto;
  recado.className = 'recado' + (classe ? ' ' + classe : '');
};

const cliente = window.supabase.createClient(AUTH.url, AUTH.chave, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

/* O link do e-mail traz o token no endereço; a biblioteca troca por
   uma sessão temporária que permite trocar a senha. */
let liberado = false;

cliente.auth.onAuthStateChange((evento) => {
  if (evento === 'PASSWORD_RECOVERY' || evento === 'SIGNED_IN') liberado = true;
});

(async () => {
  const { data } = await cliente.auth.getSession();
  if (data && data.session) liberado = true;

  if (!liberado) {
    dizer('Este link não vale mais. Peça um novo em "Esqueci minha senha", ' +
          'na tela de entrada.', 'erro');
    el('salvar').disabled = true;
  }
})();

el('salvar').addEventListener('click', async () => {
  const senha = el('senha').value;
  const repete = el('repete').value;

  if (senha.length < 8)  return dizer('A senha precisa ter pelo menos 8 caracteres.', 'erro');
  if (senha !== repete)  return dizer('As duas senhas não são iguais.', 'erro');

  el('salvar').disabled = true;
  dizer('Salvando...');

  const { error } = await cliente.auth.updateUser({ password: senha });

  if (error) {
    el('salvar').disabled = false;
    dizer(String(error.message || error), 'erro');
    return;
  }

  dizer('Senha salva. Já pode usar a Central.', 'ok');
  setTimeout(() => { location.href = './'; }, 1600);
});

[el('senha'), el('repete')].forEach((campo) => {
  campo.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') el('salvar').click();
  });
});
</script>

</body>
</html>
