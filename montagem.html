<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2f2f0">
<title>Vistoria de Equipe de Montagem · Dalmóbile</title>

<!-- ============================================================
     VISTORIA DE EQUIPE DE MONTAGEM — tela do responsável
     ------------------------------------------------------------
     Controle interno: quem preenche confere o trabalho da equipe
     de montagem. O cliente não vê nem assina.

     São 36 itens, quase o dobro do Documento 101, e isso manda na
     tela inteira: cada item ocupa POUCO espaço vertical e se
     resolve em um toque. Um item que exige dois toques vira 72
     toques no total, e um formulário que ninguém termina.

     O que NÃO tem aqui, de propósito: um botão de "marcar tudo
     como conforme". Ele economizaria minutos reais, já que a
     maioria das montagens passa — e é exatamente por isso que
     acabaria com a inspeção. Um checklist preenchido de uma vez
     só não é registro de nada.

     Depende de campo.js (armazém offline, fotos, conexão), que é
     o mesmo código usado pela tela de medição.
     ============================================================ -->

<style>
  :root {
    --bg: #f2f2f0; --card: #fff; --ink: #141618; --ink-2: #4a5054;
    --muted: #8a9094; --line: #e0e1df; --line-2: #c9cbc8;
    --ok: #1c6b3f; --ok-bg: #eef3ee; --ok-line: #cfe0d2;
    --aviso: #8a4b12; --aviso-bg: #fdf1e7; --aviso-line: #f0cfae;
    --erro: #b3261e; --erro-bg: #fdeceb; --erro-line: #f3c9c6;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-size: 16px; line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 0 16px 120px; }

  .topo { position: relative; padding: 24px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .marca { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .marca span { font-weight: 400; color: var(--muted); }
  .assinatura { margin: 3px 0 0; font-size: 10px; font-weight: 600; letter-spacing: .18em;
                text-transform: uppercase; color: var(--muted); }

  .voltar { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0;
            padding: 13px 0; margin: 0 0 6px; font-family: inherit; font-size: 14.5px;
            font-weight: 600; color: var(--ink-2); cursor: pointer; text-decoration: none; }

  .rede { display: none; align-items: center; gap: 8px; padding: 10px 14px; margin-bottom: 16px;
          border-radius: 10px; font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  .rede.off { display: flex; background: var(--aviso-bg); border: 1px solid var(--aviso-line); color: var(--aviso); }
  .rede.pendente { display: flex; background: var(--ok-bg); border: 1px solid var(--ok-line); color: var(--ok); }
  .rede b { display: block; font-weight: 400; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }

  .painel { background: var(--card); border: 1px solid var(--line);
            border-radius: var(--radius); padding: 18px; margin-bottom: 18px; }
  .painel > h2 { margin: 0 0 3px; font-size: 17px; font-weight: 700; letter-spacing: -0.015em; }
  .painel > h2 + p { margin: 0 0 16px; font-size: 13.5px; color: var(--ink-2); }

  label.rot { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em;
              text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }

  input[type=text], textarea, select {
    width: 100%; font-family: inherit; font-size: 16px; color: var(--ink);
    background: #fff; border: 1px solid var(--line-2); border-radius: 10px;
    padding: 12px 13px; line-height: 1.45; min-height: 46px;
  }
  textarea { resize: vertical; min-height: 70px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--ink); outline-offset: -2px; }

  .dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .campo { margin-bottom: 14px; }
  .historico { margin-top: 22px; }
  .versao {
    border: 1px solid var(--line); border-radius: 12px; background: var(--card);
    padding: 11px 13px; margin-top: 8px;
  }
  .versao .topo { display: flex; align-items: baseline; gap: 8px; }
  .versao .numero { font-weight: 700; font-size: 14px; }
  .versao .quando { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  .versao .porque { font-size: 13.5px; color: var(--ink-2); margin: 3px 0 0; }
  .versao .digital {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; color: var(--muted); margin-top: 5px; word-break: break-all;
  }
  .versao.pendente { border-style: dashed; }
  .historico .recado { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 8px; }
  .acrescentar { margin: -4px 0 18px; }
  .acrescentar .mais {
    border: 1px dashed var(--line-2); background: none; color: var(--muted);
    border-radius: 10px; padding: 9px 14px; font: inherit; font-size: 13.5px;
    cursor: pointer; width: 100%;
  }
  .acrescentar .mais.firme {
    border-style: solid; border-color: var(--ink); background: var(--ink);
    color: #fff; width: auto; flex: 0 0 auto; font-weight: 600;
  }
  .acrescentar-forma { display: flex; gap: 7px; }
  .acrescentar-forma input {
    flex: 1; min-width: 0; padding: 9px 11px; font: inherit; font-size: 14px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card);
    color: var(--ink);
  }
  .acrescentar .oculto { display: none; }
  .item.acrescentado { border-left: 3px solid var(--line-2); }
  .item.acrescentado h3 { display: flex; align-items: flex-start; gap: 8px; }
  .tirar-extra {
    margin-left: auto; border: 0; background: none; color: var(--muted);
    font-size: 19px; line-height: 1; cursor: pointer; padding: 0 2px;
  }
  .montadores { display: flex; flex-wrap: wrap; gap: 7px; }
  .montadores button {
    padding: 8px 13px; border-radius: 999px; font: inherit; font-size: 14px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink-2);
    cursor: pointer;
  }
  /* --accent nao existe nesta pagina; e variavel da Central. Com
     ela, a ficha marcada ficava com texto branco sobre fundo
     transparente: invisivel. A paleta daqui usa --ink. */
  .montadores button[aria-pressed="true"] {
    background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600;
  }
  /* Quem saiu da equipe depois de ter trabalhado nesta montagem:
     continua escolhido, e so aparece porque esta no registro. */
  .montadores button.fora[aria-pressed="true"] { opacity: .72; }
  .montadores .vazio { color: var(--muted); font-size: 13px; line-height: 1.5; }
  @media (max-width: 430px) { .dupla { grid-template-columns: 1fr; } }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px;
         font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
         border-radius: 10px; padding: 13px 18px; border: 1px solid var(--ink);
         background: var(--ink); color: #fff; min-height: 46px; }
  .btn.vazio { background: #fff; color: var(--ink); }
  .btn.largo { width: 100%; }
  .btn:disabled { opacity: .45; cursor: default; }
  /* ⚠️ ISTO NÃO É ENFEITE.
     A regra .btn traz display:inline-flex, e classe vence o
     estilo que o navegador dá a [hidden]. Sem esta linha,
     'botao.hidden = true' não esconde nada: o botão "Enviar"
     vinha aparecendo em quem NÃO sabe compartilhar arquivo —
     ou seja, justamente o botão que não fazia nada, que é o
     que o código tentava evitar. */
  .btn[hidden] { display: none !important; }

  /* O cartão é um contêiner, não um botão: dentro dele vive o
     botão de abrir e, para o administrador, o de apagar. Botão
     dentro de botão é HTML inválido e o clique fica imprevisível. */
  .ficha { background: var(--card); border: 1px solid var(--line);
           border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .ficha.removido { opacity: .62; border-style: dashed; }

  .ficha > .abrir { display: block; width: 100%; text-align: left; background: none;
                    border: 0; padding: 15px 16px; cursor: pointer; font-family: inherit;
                    color: inherit; }

  .ficha .acoes { display: flex; gap: 8px; padding: 0 16px 13px; }
  .ficha .acoes button { font-family: inherit; font-size: 13px; font-weight: 600;
                         cursor: pointer; border-radius: 9px; padding: 10px 13px;
                         min-height: 44px; background: #fff;
                         border: 1px solid var(--erro-line); color: var(--erro); }
  .ficha .acoes button:disabled { opacity: .5; cursor: default; }
  .ficha h3 { margin: 0 0 3px; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .ficha p { margin: 0; font-size: 13px; color: var(--ink-2); }
  .ficha .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }

  .tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .08em;
         text-transform: uppercase; padding: 4px 8px; border-radius: 6px;
         background: #f2f2f0; color: var(--ink-2); border: 1px solid var(--line); }
  .tag.ok    { background: var(--ok-bg);    color: var(--ok);    border-color: var(--ok-line); }
  .tag.aviso { background: var(--aviso-bg); color: var(--aviso); border-color: var(--aviso-line); }
  .tag.erro  { background: var(--erro-bg);  color: var(--erro);  border-color: var(--erro-line); }

  /* ---------- documentos da equipe ---------- */

  .equipe-titulo { display: flex; align-items: baseline; justify-content: space-between;
                   gap: 12px; margin: 32px 0 6px; }
  .equipe-titulo h2 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .14em;
                      text-transform: uppercase; color: var(--muted); }
  .equipe-sub { margin: 0 0 12px; font-size: 12.5px; color: var(--ink-2); line-height: 1.4; }

  .autor { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
           padding: 4px 8px; border-radius: 6px; background: #ebebe8;
           border: 1px solid var(--line-2); color: var(--ink-2); }
  .autor.meu { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); }

  .vazio-msg { text-align: center; padding: 30px 16px; color: var(--ink-2); font-size: 14.5px; }

  /* ---------- blocos e itens ---------- */

  .bloco-titulo { display: flex; align-items: baseline; justify-content: space-between;
                  gap: 12px; margin: 30px 0 12px; }
  .bloco-titulo h2 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .14em;
                     text-transform: uppercase; color: var(--muted); }
  .bloco-titulo .conta { font-size: 11.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .bloco-titulo .conta.pronto { color: var(--ok); }
  .bloco-titulo .conta.falta  { color: var(--aviso); }

  /* Item enxuto: 36 deles precisam caber numa rolagem que
     alguém termina. Sem card, sem sombra, sem respiro grande. */
  .item { background: var(--card); border: 1px solid var(--line);
          border-radius: 11px; padding: 13px 14px; margin-bottom: 8px; }
  .item.nao { border-color: var(--erro-line); background: #fffcfc; }

  .item h3 { margin: 0 0 10px; font-size: 14.5px; font-weight: 600;
             line-height: 1.35; letter-spacing: -0.005em; }

  .escolha { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .escolha button {
    font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    border-radius: 9px; padding: 12px 4px; min-height: 46px; line-height: 1.2;
    border: 1.5px solid var(--line-2); background: #fff; color: var(--ink-2);
  }
  .escolha button[aria-pressed=true].sim { background: var(--ok-bg);   border-color: var(--ok);   color: var(--ok); }
  .escolha button[aria-pressed=true].nao { background: var(--erro-bg); border-color: var(--erro); color: var(--erro); }
  .escolha button[aria-pressed=true].na  { background: #ebebe8;        border-color: var(--line-2); color: var(--ink-2); }

  .extras { display: flex; gap: 7px; align-items: center; margin-top: 9px; flex-wrap: wrap; }

  .anexar, .obs-btn {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    border: 1.5px solid var(--line-2); border-radius: 9px;
    padding: 10px 13px; min-height: 44px; background: #fff;
    font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-2);
  }
  .anexar span { font-size: 16px; line-height: 1; }
  .obs-btn[aria-expanded=true] { background: #ebebe8; }

  /* Item não conforme e sem registro: os botões cobram. */
  .item.nao .anexar.vazio { border-color: var(--erro); color: var(--erro); background: var(--erro-bg); }

  .obs-campo { margin-top: 9px; }
  .obs-campo[hidden] { display: none; }

  .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .fotos:not(:empty) { margin-top: 9px; }
  .foto { position: relative; border-radius: 9px; overflow: hidden; border: 1px solid var(--line); background: #ebebe8; }
  .foto img { display: block; width: 100%; height: 104px; object-fit: cover; }
  .foto input { width: 100%; border: 0; border-top: 1px solid var(--line); border-radius: 0;
                font-size: 12.5px; padding: 10px 8px; background: #fff; min-height: 0; }
  .foto .tirar { position: absolute; top: 5px; right: 5px; width: 34px; height: 34px;
                 border-radius: 50%; border: 0; background: rgba(20,22,24,.78); color: #fff;
                 font-size: 17px; line-height: 1; cursor: pointer; }

  .barra { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(242,242,240,.96);
           backdrop-filter: blur(8px); border-top: 1px solid var(--line);
           padding: 11px 16px calc(11px + env(safe-area-inset-bottom)); z-index: 40; }
  .barra .dentro { max-width: 620px; margin: 0 auto; display: flex; gap: 9px; align-items: center; }
  .barra .estado { flex: 1; font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }
  .barra .btn { flex: 0 0 auto; }

  .oculto { display: none !important; }
</style>

<style id="trava-entrada">html { visibility: hidden; }</style>
</head>

<body>
<div class="wrap">

  <header class="topo">
    <h1 class="marca">Dalmóbile <span>· Central de Peças</span></h1>
    <p class="assinatura">Vistoria de Equipe de Montagem</p>
  </header>

  <div class="rede" id="rede"></div>

  <section id="tela-lista">
    <a class="voltar" href="index.html">← Voltar para a Central</a>

    <div class="painel">
      <h2>Montagens</h2>
      <p>Controle interno de qualidade. Tudo fica salvo neste aparelho, com ou sem internet.</p>
      <button class="btn largo" id="nova">+ Nova montagem</button>
    </div>

    <div id="lista"></div>

    <div class="equipe-titulo oculto" id="equipe-titulo">
      <h2 id="equipe-rotulo"></h2>
    </div>
    <p class="equipe-sub oculto" id="equipe-sub"></p>
    <div id="equipe"></div>
  </section>

  <section id="tela-ficha" class="oculto">
    <button class="voltar" id="voltar-lista">← Montagens</button>

    <div class="painel">
      <h2>Dados da montagem</h2>

      <div class="campo">
        <label class="rot" for="f-cliente">Cliente</label>
        <input type="text" id="f-cliente" autocomplete="off" placeholder="Nome do cliente">
      </div>

      <div class="dupla">
        <div class="campo">
          <label class="rot" for="f-contrato">Nº do contrato</label>
          <input type="text" id="f-contrato" autocomplete="off" placeholder="OR-D...">
        </div>
        <div class="campo">
          <label class="rot" for="f-loja">Loja</label>
          <select id="f-loja">
            <option value="sjc">São José dos Campos</option>
            <option value="cgt">Caraguatatuba</option>
          </select>
        </div>
      </div>

      <div class="campo">
        <label class="rot" for="f-ambiente">Ambiente</label>
        <input type="text" id="f-ambiente" autocomplete="off" placeholder="Ex.: Cozinha e área de serviço">
      </div>

      <div class="campo">
        <label class="rot" for="f-responsavel">Responsável pelo preenchimento</label>
        <input type="text" id="f-responsavel" autocomplete="off" placeholder="Seu nome">
      </div>

      <div class="campo" style="margin-bottom:0">
        <label class="rot">Equipe de montagem</label>
        <div id="f-montadores" class="montadores"></div>
      </div>
    </div>

    <div id="blocos"></div>

    <div class="campo" style="margin-top:22px">
      <label class="rot" for="f-observacoes">Observações gerais e não conformidades</label>
      <textarea id="f-observacoes" placeholder="O que não coube nos itens acima"></textarea>
    </div>

    <div class="historico" id="historico">
      <button type="button" class="btn vazio largo" id="ver-historico" aria-expanded="false">
        Histórico de versões
      </button>
      <div id="historico-lista" hidden></div>
    </div>

    <button class="btn vazio largo" id="apagar"
            style="margin-top:6px;border-color:var(--erro-line);color:var(--erro)">
      Apagar esta montagem
    </button>
  </section>

</div>

<div class="barra oculto" id="barra">
  <div class="dentro">
    <div class="estado" id="estado"></div>
    <button class="btn vazio" id="enviar" hidden>Enviar</button>
    <button class="btn" id="salvar">Salvar PDF</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/fontkit.umd.min.js"></script>
<script src="campo.js"></script>
<script src="auth.js"></script>
<script src="pdf-doc.js"></script>
<script src="pdf-montagem.js"></script>
<script>
(function () {
  'use strict';

  const C = window.Campo;
  const Armazem = C.armazem('montagens');

  /* A lista de blocos agora depende da ficha aberta, porque cada
     uma pode ter itens acrescentados à mão. Pedir sempre ao
     PDFMontagem evita que a tela e o PDF discordem sobre o que
     existe. */
  function blocosAtuais() {
    if (!window.PDFMontagem) return [];
    return PDFMontagem.blocos(atual ? atual.dados : null);
  }

  let atual = null;
  let salvando = null;
  const previas = {};

  function el(id) { return document.getElementById(id); }


  /* ============================================================
     Nova ficha
     ============================================================ */

  function fichaNova() {
    const eu = window.dalmobileAuth && window.dalmobileAuth.usuario;

    return {
      id: C.novoId('mont'),
      remoto: null,
      enviado: false,
      cliente: '', contrato: '',
      loja: (window.EU && window.EU.loja) || 'sjc',
      criado_em: C.agora(),
      atualizado_em: C.agora(),
      dados: {
        ambiente: '',
        montadores: [],
        responsavel: (eu && eu.user_metadata && eu.user_metadata.nome) || '',
        itens: {},
        observacoes: ''
      }
    };
  }


  /* ============================================================
     Conexão
     ============================================================ */

  async function pintarRede() {
    const faixa = el('rede');
    const pendentes = (await Armazem.todas()).filter(function (m) { return !m.enviado && !m.removido; }).length;

    faixa.className = 'rede';
    faixa.innerHTML = '';

    if (!navigator.onLine) {
      faixa.classList.add('off');
      faixa.innerHTML = 'Sem internet — tudo continua funcionando.' +
        '<b>O que você preencher fica salvo aqui e sobe sozinho quando o sinal voltar. ' +
        'O PDF você gera mesmo offline.</b>';
      return;
    }

    if (pendentes) {
      faixa.classList.add('pendente');
      faixa.innerHTML = pendentes + (pendentes > 1 ? ' montagens ainda não subiram.' : ' montagem ainda não subiu.') +
        '<b>Elas sobem sozinhas; se demorar, é só abrir a montagem que ela tenta de novo.</b>';
    }
  }

  window.addEventListener('online',  function () { pintarRede(); sincronizarTudo(); });
  window.addEventListener('offline', pintarRede);


  /* ============================================================
     Lista
     ============================================================ */

  const TIPO_DOC = 'montagem';
  const ROTULO_EQUIPE = 'Montagens da equipe';

  async function montarPdfDe(doc) {
    const bytes = await PDFMontagem.montar(doc);
    return { nome: PDFMontagem.nomeDoArquivo(doc),
             blob: new Blob([bytes], { type: 'application/pdf' }) };
  }

  /* ============================================================
     Documentos da equipe
     ------------------------------------------------------------
     A lista de cima é o que está NESTE aparelho, que é o que o
     medidor edita. Esta é o que está no servidor, que é só
     consulta — e por isso não tem botão de editar, só de baixar
     o PDF, que o navegador remonta a partir dos dados.

     Aparece só para gerente e administrador. Para o consultor a
     seção inteira some: a lista dele já é a de cima.

     E não aparece offline. Sem rede não há o que mostrar, e uma
     seção vazia com um aviso de erro no meio da tela de campo
     seria ruído num lugar onde ruído atrapalha.
     ============================================================ */

  async function desenharEquipe() {
    const caixa = el('equipe');
    const titulo = el('equipe-titulo');
    const sub = el('equipe-sub');

    const eu = await C.eu();
    const podeVer = eu.admin || eu.gerente;

    if (!podeVer || !C.temServidor()) {
      titulo.classList.add('oculto');
      sub.classList.add('oculto');
      caixa.innerHTML = '';
      return;
    }

    titulo.classList.remove('oculto');
    sub.classList.remove('oculto');
    el('equipe-rotulo').textContent = ROTULO_EQUIPE;
    sub.textContent = eu.admin
      ? 'Todas as lojas. Só consulta — para editar, use o aparelho de quem preencheu.'
      : 'Da sua loja. Só consulta — para editar, use o aparelho de quem preencheu.';

    caixa.innerHTML = '<p class="vazio-msg">Carregando...</p>';

    const linhas = await C.listarDaEquipe(TIPO_DOC);

    if (linhas === null) {
      caixa.innerHTML = '<p class="vazio-msg">Não consegui carregar agora.</p>';
      return;
    }

    /* O que já está neste aparelho sai da lista: apareceria duas
       vezes, uma editável e outra não, o que confunde mais do
       que ajuda. */
    const meus = (await Armazem.todas())
      .map(function (m) { return m.remoto; })
      .filter(Boolean);

    const outros = linhas.filter(function (l) { return meus.indexOf(l.id) === -1; });

    if (!outros.length) {
      caixa.innerHTML = '<p class="vazio-msg">Nada da equipe por aqui ainda.</p>';
      return;
    }

    caixa.innerHTML = '';

    outros.forEach(function (d) {
      caixa.appendChild(cartaoDaEquipe(d, eu));
    });
  }

  function cartaoDaEquipe(d, eu) {
    const cartao = document.createElement('div');
    cartao.className = 'ficha';

    const meu = d.autor === eu.id;

    const corpo = document.createElement('div');
    corpo.style.padding = '15px 16px';
    corpo.innerHTML =
      '<h3>' + C.escapar(d.cliente || 'Sem nome') + '</h3>' +
      '<p>' + C.escapar(d.contrato || 'sem contrato') + ' · ' +
              (d.loja === 'cgt' ? 'Caraguatatuba' : 'São José dos Campos') + ' · ' +
              C.dataCurta(d.atualizado_em) + '</p>' +
      '<div class="tags">' +
        C.pintarEtiqueta(C.etiquetaParecer(d)) +
        C.pintarEtiqueta(C.etiquetaEstado(d)) +
        (d.autorNome
          ? '<span class="autor' + (meu ? ' meu' : '') + '">' +
            C.escapar(meu ? 'você' : d.autorNome) + '</span>'
          : '') +
      '</div>';

    cartao.appendChild(corpo);

    const acoes = document.createElement('div');
    acoes.className = 'acoes';
    acoes.style.paddingTop = '0';

    const baixar = document.createElement('button');
    baixar.textContent = 'baixar PDF';
    baixar.style.borderColor = 'var(--line-2)';
    baixar.style.color = 'var(--ink-2)';

    baixar.onclick = async function () {
      baixar.disabled = true;
      baixar.textContent = 'gerando…';

      try {
        /* As fotos ficam no aparelho de quem preencheu, não no
           servidor. O PDF sai completo no texto e sem imagem —
           e diz isso, para ninguém achar que não houve foto. */
        const pdf = await montarPdfDe({
          cliente: d.cliente, contrato: d.contrato, loja: d.loja,
          dados: d.dados, preenchido_em: d.atualizado_em, fotos: {}
        });
        await C.entregar(null, pdf.blob, pdf.nome);
      } catch (erro) {
        console.error(erro);
        alert('Não consegui gerar o PDF. ' + (erro.message || ''));
      } finally {
        baixar.disabled = false;
        baixar.textContent = 'baixar PDF';
      }
    };

    acoes.appendChild(baixar);

    if (eu.admin) {
      const apagar = document.createElement('button');
      apagar.textContent = 'apagar do sistema';

      apagar.onclick = async function () {
        if (!confirm('Mandar o documento de ' + (d.cliente || 'sem nome') +
                     ' para a lixeira?\n\nDá para restaurar na aba Contas.')) return;

        apagar.disabled = true;
        apagar.textContent = 'apagando…';

        try {
          await C.mandarParaLixeira(d.id);
          desenharEquipe();
        } catch (erro) {
          alert(erro.message);
          apagar.disabled = false;
          apagar.textContent = 'apagar do sistema';
        }
      };

      acoes.appendChild(apagar);
    }

    cartao.appendChild(acoes);
    return cartao;
  }

  async function mostrarLista() {
    el('tela-ficha').classList.add('oculto');
    el('tela-lista').classList.remove('oculto');
    el('barra').classList.add('oculto');
    atual = null;
    limparPrevias();

    await pintarRede();
    desenharEquipe();

    const todas = (await Armazem.todas()).sort(function (a, b) {
      return String(b.atualizado_em).localeCompare(String(a.atualizado_em));
    });

    const caixa = el('lista');

    if (!todas.length) {
      caixa.innerHTML = '<p class="vazio-msg">Nenhuma montagem ainda.<br>' +
        'Toque em <b>Nova montagem</b> antes de sair — assim a tela já fica ' +
        'guardada no aparelho.</p>';
      return;
    }

    caixa.innerHTML = '';

    const souAdmin = (await C.eu()).admin;

    todas.forEach(function (m) {
      const c = PDFMontagem.contar(m.dados);

      const cartao = document.createElement('div');
      cartao.className = 'ficha' + (m.removido ? ' removido' : '');

      const abrir = document.createElement('button');
      abrir.className = 'abrir';
      abrir.onclick = function () { abrirFicha(m.id); };

      abrir.innerHTML =
        '<h3>' + C.escapar(m.cliente || 'Sem nome') + '</h3>' +
        '<p>' + C.escapar(m.dados.ambiente || 'ambiente não informado') + ' · ' +
                C.escapar(m.contrato || 'sem contrato') + ' · ' +
                C.dataCurta(m.atualizado_em) + '</p>' +
        '<div class="tags">' +
          etiquetaDoEnvio(m) +
          (m.versao ? '<span class="tag">versão ' + m.versao + '</span>' : '') +
          ((m.marcos || []).length
            ? '<span class="tag aviso">' + m.marcos.length + ' versão a subir</span>' : '') +
          C.pintarEtiqueta(C.etiquetaParecer({ tipo: TIPO_DOC, dados: m.dados })) +
          (c.faltam ? '<span class="tag">' + c.faltam + ' sem resposta</span>' : '') +
          (c.nao ? '<span class="tag erro">' + c.nao + ' não conforme</span>' : '') +
          (!c.faltam && !c.nao ? '<span class="tag ok">tudo conforme</span>' : '') +
        '</div>';

      cartao.appendChild(abrir);

      if (souAdmin && m.remoto && !m.removido) {
        cartao.appendChild(acaoDeApagar(m, 'montagem'));
      }

      caixa.appendChild(cartao);
    });
  }


  /* ============================================================
     Ficha
     ============================================================ */

  async function abrirFicha(id) {
    const m = await Armazem.ler(id);
    if (!m) return mostrarLista();

    atual = m;
    limparPrevias();

    el('tela-lista').classList.add('oculto');
    el('tela-ficha').classList.remove('oculto');
    el('barra').classList.remove('oculto');
    window.scrollTo(0, 0);

    el('f-cliente').value     = m.cliente || '';
    el('f-contrato').value    = m.contrato || '';
    el('f-loja').value        = m.loja || 'sjc';
    el('f-ambiente').value    = m.dados.ambiente || '';
    el('f-responsavel').value = m.dados.responsavel || '';
    /* Ficha antiga não tem o campo: sem isto, o primeiro toque
       num montador leria undefined e perderia a escolha. */
    if (!Array.isArray(m.dados.montadores)) m.dados.montadores = [];
    pintarMontadores();

    /* Fecha o histórico ao trocar de ficha: aberto, ele mostraria
       as versões da anterior até alguém tocar de novo. */
    el('historico-lista').hidden = true;
    el('historico-lista').innerHTML = '';
    el('ver-historico').setAttribute('aria-expanded', 'false');
    el('f-observacoes').value = m.dados.observacoes || '';

    desenharBlocos();
    pintarEstado();
    sincronizar(m);
  }

  /* ------------------------------------------------------------
     Acrescentar item à mão
     ------------------------------------------------------------
     A obra traz coisa que o checklist não previu. Antes isso só
     cabia em "observações gerais", onde não responde, não conta
     e não recebe foto.

     O id leva acaso junto com o relógio: duas fichas podem ser
     preenchidas no mesmo milissegundo em aparelhos diferentes e
     subir para o mesmo contrato. Dois itens com o mesmo id
     compartilhariam resposta e foto, calados.
     ------------------------------------------------------------ */
  function novoIdDeItem() {
    return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function acrescentarItem(bloco) {
    const area = document.createElement('div');
    area.className = 'acrescentar';

    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mais';
    b.textContent = '+ acrescentar item';

    const forma = document.createElement('div');
    forma.className = 'acrescentar-forma oculto';

    const campo = document.createElement('input');
    campo.type = 'text';
    campo.placeholder = 'O que verificar';
    campo.autocomplete = 'off';

    const ok = document.createElement('button');
    ok.type = 'button';
    ok.className = 'mais firme';
    ok.textContent = 'Incluir';

    function abrir() {
      forma.classList.remove('oculto');
      b.classList.add('oculto');
      campo.focus();
    }

    function fechar() {
      forma.classList.add('oculto');
      b.classList.remove('oculto');
      campo.value = '';
    }

    function incluir() {
      const texto = campo.value.trim();
      if (!texto) { campo.focus(); return; }

      atual.dados.extras = Array.isArray(atual.dados.extras) ? atual.dados.extras : [];
      atual.dados.extras.push({ id: novoIdDeItem(), bloco: bloco.id, texto: texto });

      fechar();
      guardar();
      desenharBlocos();
    }

    b.addEventListener('click', abrir);
    ok.addEventListener('click', incluir);
    campo.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') incluir();
      if (e.key === 'Escape') fechar();
    });

    forma.append(campo, ok);
    area.append(b, forma);
    return area;
  }

  /* Tirar um item acrescentado leva junto a resposta e a foto
     dele. Sem isso, a contagem passaria a somar uma resposta de
     um item que ninguém mais vê. */
  function tirarExtra(id) {
    atual.dados.extras = (atual.dados.extras || []).filter(function (x) { return x.id !== id; });
    /* As fotos moram dentro do próprio item, então apagar a
       resposta leva as fotos junto. */
    if (atual.dados.itens) delete atual.dados.itens[id];
    guardar();
    desenharBlocos();
  }

  /* ------------------------------------------------------------
     Histórico de versões
     ------------------------------------------------------------
     A versão já era gravada em cada PDF gerado, com a impressão
     digital do arquivo — faltava onde olhar.

     Duas origens, e as duas importam: o que já subiu (servidor)
     e o que ainda está na fila do aparelho. Mostrar só o que
     subiu esconderia justamente a versão do momento em que o
     cliente viu o documento, que é a que foi gerada na obra, sem
     sinal.
     ------------------------------------------------------------ */
  const MOTIVOS = {
    pdf: 'PDF gerado',
    assinado: 'documento assinado',
    correcao: 'correção depois de assinado',
    reabertura: 'medição reaberta'
  };

  function cartaoDeVersao(v, pendente) {
    const d = document.createElement('div');
    d.className = 'versao' + (pendente ? ' pendente' : '');

    const topo = document.createElement('div');
    topo.className = 'topo';

    const num = document.createElement('span');
    num.className = 'numero';
    num.textContent = pendente ? 'a subir' : 'versão ' + v.numero;

    const quando = document.createElement('span');
    quando.className = 'quando';
    quando.textContent = dataLonga(pendente ? v.em : v.criada_em);

    topo.append(num, quando);

    const porque = document.createElement('p');
    porque.className = 'porque';
    porque.textContent = (MOTIVOS[v.motivo] || v.motivo || 'sem motivo registrado') +
      (v.criada_por_nome ? ' · ' + v.criada_por_nome : '');

    d.append(topo, porque);

    if (v.hash) {
      const dig = document.createElement('p');
      dig.className = 'digital';
      /* Os 16 primeiros bastam para conferir à vista se o papel
         na mão é esta versão; o resto só ocuparia a tela. */
      dig.textContent = 'impressão digital ' + String(v.hash).slice(0, 16);
      d.appendChild(dig);
    }

    return d;
  }

  function dataLonga(iso) {
    const d = new Date(iso);
    if (!iso || isNaN(d)) return 'sem data';
    return d.toLocaleDateString('pt-BR') + ' às ' +
           d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function recado(caixa, texto) {
    const p = document.createElement('p');
    p.className = 'recado';
    p.textContent = texto;
    caixa.appendChild(p);
  }

  async function desenharHistorico() {
    const caixa = el('historico-lista');
    caixa.innerHTML = '';
    if (!atual) return;

    /* A fila do aparelho primeiro: é o que acabou de acontecer. */
    const fila = atual.marcos || [];

    const sb = C.temServidor();
    let subidas = [];
    let falhou = null;

    if (sb && atual.remoto) {
      try {
        const r = await sb.from('formulario_historico')
          .select('numero, motivo, hash, criada_em, criada_por_nome')
          .eq('formulario', atual.remoto)
          .order('numero', { ascending: false });
        if (r.error) falhou = r.error.message;
        else subidas = r.data || [];
      } catch (e) {
        falhou = e.message;
      }
    }

    fila.slice().reverse().forEach(function (m) {
      caixa.appendChild(cartaoDeVersao(m, true));
    });
    subidas.forEach(function (v) { caixa.appendChild(cartaoDeVersao(v, false)); });

    if (!fila.length && !subidas.length) {
      recado(caixa, falhou
        ? 'Não consegui ler o histórico agora: ' + falhou
        : (!atual.remoto
            ? 'Esta montagem ainda não subiu. A primeira versão nasce quando o PDF for gerado.'
            : 'Nenhuma versão ainda. Elas nascem quando o PDF é gerado.'));
      return;
    }

    if (!sb || !atual.remoto) {
      recado(caixa, 'Sem conexão: aparecem só as versões guardadas neste aparelho. ' +
                    'As que já subiram aparecem quando houver sinal.');
    } else if (falhou) {
      recado(caixa, 'As versões do servidor não vieram agora: ' + falhou);
    }
  }

  (function ligarHistorico() {
    const b = el('ver-historico');
    const caixa = el('historico-lista');
    if (!b || !caixa) return;

    b.addEventListener('click', async function () {
      const abrindo = caixa.hidden;
      caixa.hidden = !abrindo;
      b.setAttribute('aria-expanded', String(abrindo));
      if (abrindo) {
        caixa.innerHTML = '';
        recado(caixa, 'Carregando...');
        await desenharHistorico();
      }
    });
  })();

  function desenharBlocos() {
    const caixa = el('blocos');
    caixa.innerHTML = '';

    blocosAtuais().forEach(function (bloco) {
      const cab = document.createElement('div');
      cab.className = 'bloco-titulo';
      cab.innerHTML = '<h2>' + C.escapar(bloco.titulo) + '</h2>' +
                      '<span class="conta" data-bloco="' + bloco.id + '"></span>';
      caixa.appendChild(cab);

      bloco.itens.forEach(function (item) {
        caixa.appendChild(montarItem(bloco, item));
      });

      caixa.appendChild(acrescentarItem(bloco));
    });

    pintarContas();
  }

  /* Quantos faltam em cada bloco. Com 36 itens, rolar de volta
     para procurar o que ficou em branco é o jeito mais rápido de
     desistir do formulário. */

  /* Três estados, não dois. O terceiro só aparece depois que a
     sincronia descobre que o administrador mandou a ficha para a
     lixeira — e é importante que o medidor veja isso, em vez de
     achar que o registro dele continua valendo. */
  function etiquetaDoEnvio(m) {
    if (m.removido) return '<span class="tag erro">removido pelo administrador</span>';
    return m.enviado ? '<span class="tag ok">no sistema</span>'
                     : '<span class="tag aviso">só neste aparelho</span>';
  }

  /* Só para administrador, e só no que já subiu: o que ainda está
     no aparelho se resolve com o "Apagar" de dentro da ficha. */
  function acaoDeApagar(m, oQue) {
    const linha = document.createElement('div');
    linha.className = 'acoes';

    const b = document.createElement('button');
    b.textContent = 'apagar do sistema';

    b.onclick = async function () {
      if (!confirm('Mandar a ' + oQue + ' de ' + (m.cliente || 'sem nome') +
                   ' para a lixeira?\n\n' +
                   'Ela some das listas na hora. Dá para restaurar depois, ' +
                   'na aba Contas da Central.')) return;

      b.disabled = true;
      b.textContent = 'apagando…';

      try {
        await C.mandarParaLixeira(m.remoto);
        m.removido = true;
        await Armazem.salvar(m);
        mostrarLista();
      } catch (erro) {
        alert(erro.message);
        b.disabled = false;
        b.textContent = 'apagar do sistema';
      }
    };

    linha.appendChild(b);
    return linha;
  }

  function pintarContas() {
    blocosAtuais().forEach(function (bloco) {
      const alvo = document.querySelector('.conta[data-bloco="' + bloco.id + '"]');
      if (!alvo) return;

      const respostas = atual.dados.itens || {};
      const faltam = bloco.itens.filter(function (i) {
        return !(respostas[i.id] || {}).resposta;
      }).length;

      alvo.textContent = faltam
        ? faltam + ' de ' + bloco.itens.length + ' sem resposta'
        : 'completo';
      alvo.className = 'conta ' + (faltam ? 'falta' : 'pronto');
    });
  }

  function montarItem(bloco, item) {
    const v = PDFMontagem.VOCABULARIO[bloco.vocabulario];

    const resposta = atual.dados.itens[item.id] ||
                     (atual.dados.itens[item.id] = { resposta: '', obs: '', fotos: [] });

    const d = document.createElement('div');
    d.className = 'item' + (resposta.resposta === 'nao' ? ' nao' : '') +
                           (item.extra ? ' acrescentado' : '');

    d.innerHTML =
      '<h3>' + C.escapar(item.texto) +
        (item.extra ? '<button type="button" class="tirar-extra" title="Tirar este item">×</button>' : '') +
      '</h3>' +
      '<div class="escolha">' +
        '<button type="button" class="sim" data-v="ok">'  + C.escapar(v.ok)  + '</button>' +
        '<button type="button" class="nao" data-v="nao">' + C.escapar(v.nao) + '</button>' +
        '<button type="button" class="na"  data-v="na">'  + C.escapar(v.na)  + '</button>' +
      '</div>' +
      '<div class="extras">' +
        '<label class="anexar"><span>+</span> Foto' +
          '<input type="file" accept="image/*" capture="environment" hidden multiple>' +
        '</label>' +
        '<button type="button" class="obs-btn" aria-expanded="false">Observação</button>' +
      '</div>' +
      '<div class="obs-campo" hidden>' +
        '<textarea placeholder="O que foi encontrado"></textarea>' +
      '</div>' +
      '<div class="fotos"></div>';

    const botaoTirar = d.querySelector('.tirar-extra');
    if (botaoTirar) {
      botaoTirar.onclick = function () {
        /* Sem confirmar: o item foi escrito agora, por quem está
           olhando, e devolver é só escrever de novo. Confirmação
           em cada toque treina a pessoa a dizer sim sem ler. */
        tirarExtra(item.id);
      };
    }

    const anexar = d.querySelector('.anexar');
    const obsBtn = d.querySelector('.obs-btn');
    const obsCampo = d.querySelector('.obs-campo');
    const obs = d.querySelector('textarea');
    const fotos = d.querySelector('.fotos');

    obs.value = resposta.obs || '';
    obs.oninput = function () { resposta.obs = obs.value; guardar(); };

    obsBtn.onclick = function () {
      const abrindo = obsCampo.hidden;
      obsCampo.hidden = !abrindo;
      obsBtn.setAttribute('aria-expanded', String(abrindo));
      if (abrindo) obs.focus();
    };

    d.querySelectorAll('.escolha button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(resposta.resposta === b.dataset.v));

      b.onclick = function () {
        /* Tocar de novo no que já estava marcado desmarca — um
           "conforme" dado por engano precisa ter volta. */
        resposta.resposta = (resposta.resposta === b.dataset.v) ? '' : b.dataset.v;

        d.querySelectorAll('.escolha button').forEach(function (o) {
          o.setAttribute('aria-pressed', String(resposta.resposta === o.dataset.v));
        });

        d.className = 'item' + (resposta.resposta === 'nao' ? ' nao' : '');

        /* Não conforme abre a observação sozinho: é ali que o
           supervisor diz o que precisa ser corrigido. */
        if (resposta.resposta === 'nao' && obsCampo.hidden) {
          obsCampo.hidden = false;
          obsBtn.setAttribute('aria-expanded', 'true');
        }

        pintar();
        guardar();
        pintarEstado();
        pintarContas();
      };
    });

    function pintar() {
      anexar.classList.toggle('vazio', !(resposta.fotos || []).length);
      if (resposta.obs && obsCampo.hidden) {
        obsCampo.hidden = false;
        obsBtn.setAttribute('aria-expanded', 'true');
      }
    }

    anexar.querySelector('input').onchange = async function () {
      const novas = await C.receber(this.files, function () {
        alert('Não consegui usar uma das fotos.');
      });
      this.value = '';

      resposta.fotos = (resposta.fotos || []).concat(novas);
      await guardar();
      desenharFotos(fotos, resposta, pintar);
      pintar();
    };

    desenharFotos(fotos, resposta, pintar);
    pintar();

    return d;
  }

  function desenharFotos(caixa, resposta, aoMudar) {
    caixa.innerHTML = '';

    (resposta.fotos || []).forEach(function (f, i) {
      const d = document.createElement('div');
      d.className = 'foto';
      d.innerHTML =
        '<img alt="">' +
        '<button type="button" class="tirar" title="Remover">×</button>' +
        '<input type="text" placeholder="Legenda" value="' + C.escapar(f.legenda || '') + '">';

      const img = d.querySelector('img');

      C.fotos.ler(f.id).then(function (reg) {
        if (!reg) return;
        if (previas[f.id]) URL.revokeObjectURL(previas[f.id]);
        previas[f.id] = URL.createObjectURL(reg.blob);
        img.src = previas[f.id];
      });

      d.querySelector('input').oninput = function () {
        resposta.fotos[i].legenda = this.value;
        guardar();
      };

      d.querySelector('.tirar').onclick = function () {
        C.fotos.apagar(f.id);
        if (previas[f.id]) { URL.revokeObjectURL(previas[f.id]); delete previas[f.id]; }
        resposta.fotos.splice(i, 1);
        guardar();
        desenharFotos(caixa, resposta, aoMudar);
        if (aoMudar) aoMudar();
      };

      caixa.appendChild(d);
    });
  }


  /* ============================================================
     Salvar
     ============================================================ */

  /* ------------------------------------------------------------
     Equipe de montagem
     ------------------------------------------------------------
     O registro guarda NOME e id, não só o id. O nome é o que
     importa daqui a um ano: se o montador sair da equipe e for
     inativado, a vistoria tem que continuar dizendo quem estava
     lá — e um id solto, sem a linha do cadastro à mão, não diz
     nada a ninguém.
     ------------------------------------------------------------ */
  let cadastroDeMontadores = C.montadoresGuardados();

  function escolhidos() {
    return (atual && Array.isArray(atual.dados.montadores))
      ? atual.dados.montadores : [];
  }

  function pintarMontadores() {
    const area = el('f-montadores');
    area.innerHTML = '';
    if (!atual) return;

    const marcados = escolhidos();
    const ativos = cadastroDeMontadores.filter(function (m) { return m.ativo !== false; });

    /* Quem está no registro mas não está mais na lista de ativos
       entra assim mesmo, no fim: tirar da tela seria apagar da
       vistoria alguém que trabalhou nela. */
    const extras = marcados.filter(function (e) {
      return !ativos.some(function (m) { return m.id === e.id; });
    });

    const tudo = ativos.map(function (m) { return { id: m.id, nome: m.nome, fora: false }; })
      .concat(extras.map(function (e) { return { id: e.id, nome: e.nome, fora: true }; }));

    if (!tudo.length) {
      const vazio = document.createElement('p');
      vazio.className = 'vazio';
      vazio.textContent = cadastroDeMontadores.length
        ? 'Nenhum montador ativo no cadastro.'
        : 'A lista ainda não chegou neste aparelho. Abra a Central com internet uma vez e ela fica guardada.';
      area.appendChild(vazio);
      return;
    }

    tudo.forEach(function (m) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = m.nome;
      if (m.fora) b.className = 'fora';
      const ligado = marcados.some(function (x) { return x.id === m.id; });
      b.setAttribute('aria-pressed', ligado ? 'true' : 'false');

      b.addEventListener('click', function () {
        const lista = escolhidos().slice();
        const i = lista.findIndex(function (x) { return x.id === m.id; });
        if (i >= 0) lista.splice(i, 1);
        else lista.push({ id: m.id, nome: m.nome });
        atual.dados.montadores = lista;
        pintarMontadores();
        guardar();
      });

      area.appendChild(b);
    });
  }

  /* Busca a lista quando houver rede e repinta. Se não houver,
     a guardada continua valendo e nada na tela muda. */
  (async function trazerMontadores() {
    try {
      cadastroDeMontadores = await C.montadores();
      if (atual) pintarMontadores();
    } catch (e) {
      console.warn('Lista de montadores não atualizou agora.', e);
    }
  })();

  function colher() {
    if (!atual) return;
    atual.cliente  = el('f-cliente').value.trim();
    atual.contrato = el('f-contrato').value.trim();
    atual.loja     = el('f-loja').value;

    atual.dados.ambiente    = el('f-ambiente').value.trim();
    atual.dados.responsavel = el('f-responsavel').value.trim();
    atual.dados.observacoes = el('f-observacoes').value;
  }

  async function guardar() {
    if (!atual) return;
    colher();
    atual.atualizado_em = C.agora();
    atual.enviado = false;
    await Armazem.salvar(atual);
    pintarEstado();

    clearTimeout(salvando);

    /* Guarda a ficha, não a variável. Quando o atraso vence, o
       medidor já pode ter voltado para a lista — e aí 'atual' é
       nulo, a sincronia dispara contra nada e o que estava para
       subir fica parado no aparelho sem ninguém perceber. */
    const pendente = atual;
    salvando = setTimeout(function () { sincronizar(pendente); }, 4000);
  }

  ['f-cliente','f-contrato','f-ambiente','f-responsavel','f-observacoes'].forEach(function (id) {
    el(id).addEventListener('input', guardar);
  });
  el('f-loja').addEventListener('change', guardar);

  function pintarEstado() {
    if (!atual) return;
    const c = PDFMontagem.contar(atual.dados);

    el('estado').innerHTML = c.faltam
      ? '<b>' + (c.total - c.faltam) + '</b> de ' + c.total + ' respondidos'
      : (c.nao ? '<b>' + c.nao + '</b> não conforme' + (c.nao > 1 ? 's' : '')
               : 'Tudo conforme');
  }


  /* ============================================================
     Sincronia
     ============================================================ */

  async function sincronizar(m) {
    if (!m || m.enviado) return;

    /* Removido pelo administrador: não insiste. Sem isto o
       aparelho reenviaria a cada abertura, para sempre, e o
       banco devolveria sempre o mesmo 'apagado'. */
    if (m.removido) return;

    const sb = C.temServidor();
    if (!sb) return;

    const linha = {
      tipo: 'montagem',
      cliente: m.cliente || '',
      contrato: m.contrato || '',
      loja: m.loja,
      dados: m.dados,
      status: 'preenchido',
      preenchido_em: m.atualizado_em
    };

    try {
      /* A ficha criada em obra pode subir dias depois. Sem mandar
         a data de abertura no insert, ela viraria a data da
         SINCRONIA — e com ela o prazo contratual escorregaria
         para frente sozinho. No update ela nem vai: o banco a
         tranca, e é essa a intenção. */
      const r = m.remoto
        ? await sb.from('formularios').update(linha).eq('id', m.remoto).select('id,status').single()
        : await sb.from('formularios')
                  .insert(Object.assign({ pedido_em: m.criado_em }, linha))
                  .select('id,status').single();

      if (r.error) throw r.error;

      m.remoto = r.data.id;
      m.enviado = true;

      /* O banco devolve o estado DEPOIS do gatilho. Se voltou
         'apagado', o administrador mandou esta ficha para a
         lixeira: o conteúdo foi gravado, mas ela não revive. É
         assim que este aparelho fica sabendo. */
      m.removido = r.data.status === 'apagado';

      await Armazem.salvar(m);
      await C.enviarMarcos(m, Armazem);
      await Armazem.salvar(m);

      pintarEstado();
      pintarRede();

    } catch (erro) {
      console.warn('Não subiu agora; fica para a próxima.', erro);
    }
  }

  async function sincronizarTudo() {
    for (const m of await Armazem.todas()) {
      if (!m.enviado && !m.removido) await sincronizar(m);
    }
    pintarRede();
    if (!el('tela-lista').classList.contains('oculto')) mostrarLista();
  }


  /* ============================================================
     PDF
     ============================================================ */

  async function montarPdf() {
    colher();

    const listas = PDFMontagem.todosOsItens().map(function (par) {
      return (atual.dados.itens[par.item.id] || {}).fotos;
    });

    const fotos = await C.bytesDasFotos(listas);

    const bytes = await PDFMontagem.montar({
      cliente: atual.cliente,
      contrato: atual.contrato,
      loja: atual.loja,
      dados: atual.dados,
      preenchido_em: atual.atualizado_em,
      fotos: fotos
    });

    /* Gerar o PDF é o evento que vira versão: foi este arquivo
       que alguém imprimiu ou mandou. O marco fica no aparelho e
       sobe na próxima sincronia, com a data de hoje — não a de
       quando houver sinal. */
    C.anotarMarco(atual, 'pdf', await C.hashDoPdf(bytes));
    await guardar();

    return {
      nome: PDFMontagem.nomeDoArquivo(atual),
      blob: new Blob([bytes], { type: 'application/pdf' })
    };
  }

  /* A pasta é pedida ANTES de montar o PDF: o diálogo só abre
     enquanto o toque ainda vale para o navegador, e um checklist
     com fotos demora o bastante para estourar esse prazo. */
  el('salvar').onclick = async function () {
    if (!atual) return;

    const botao = this;
    colher();

    const destino = await C.escolherPasta(PDFMontagem.nomeDoArquivo(atual));
    if (destino === 'cancelado') return;

    botao.disabled = true;
    botao.textContent = 'Gerando…';

    try {
      const pdf = await montarPdf();
      await C.entregar(destino, pdf.blob, pdf.nome);
    } catch (erro) {
      console.error(erro);
      alert('Não consegui salvar o PDF. ' + (erro.message || ''));
    } finally {
      botao.disabled = false;
      botao.textContent = 'Salvar PDF';
    }
  };

  el('enviar').onclick = async function () {
    if (!atual) return;

    const botao = this;
    botao.disabled = true;
    botao.textContent = 'Gerando…';

    try {
      const pdf = await montarPdf();
      await C.compartilhar(pdf.blob, pdf.nome);
    } catch (erro) {
      console.error(erro);
      alert('Não consegui gerar o PDF. ' + (erro.message || ''));
    } finally {
      botao.disabled = false;
      botao.textContent = 'Enviar';
    }
  };

  el('enviar').hidden = !C.podeCompartilharArquivo();


  /* ============================================================
     Botões gerais
     ============================================================ */

  el('nova').onclick = async function () {
    const m = fichaNova();
    await Armazem.salvar(m);
    abrirFicha(m.id);
  };

  el('voltar-lista').onclick = async function () {
    await guardar();
    mostrarLista();
  };

  el('apagar').onclick = async function () {
    if (!atual) return;

    const aviso = atual.enviado
      ? 'Apagar esta montagem deste aparelho? Ela já subiu para o sistema e continua lá.'
      : 'Apagar esta montagem? Ela ainda NÃO subiu para o sistema — isso não tem volta.';

    if (!confirm(aviso)) return;

    for (const par of PDFMontagem.todosOsItens()) {
      const r = atual.dados.itens[par.item.id];
      for (const f of ((r && r.fotos) || [])) await C.fotos.apagar(f.id);
    }

    await Armazem.apagar(atual.id);
    mostrarLista();
  };


  /* ============================================================
     Miudezas e partida
     ============================================================ */

  function limparPrevias() {
    Object.keys(previas).forEach(function (id) {
      URL.revokeObjectURL(previas[id]);
      delete previas[id];
    });
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && atual) guardar();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('Service worker não registrou; a tela não vai abrir offline.', e);
    });
  }

  if (!window.PDFMontagem) {
    alert('O gerador de PDF não carregou. Abra a tela uma vez com internet.');
  }

  mostrarLista();
  sincronizarTudo();

})();
</script>
</body>
</html>
